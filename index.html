<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A co-op quest game for Forward Deployed Engineer interview prep.">
<meta name="theme-color" content="#15122E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FDE Quest">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>FDE Field Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&family=Silkscreen&display=swap">
<style>
/* Layout: a co-op quest game. Four screens behind a chunky bottom bar (Base, Map, Party, Trophies); a training timer floats above it. One deliberate dark "night quest" world, no light variant. */
:root{
  --bg:#15122E; --bg2:#1C1840; --panel:#252050; --panel2:#2E2862; --edge:#463F8E; --edge-hi:#7068D0; --shadow:#0B0920;
  --ink:#F4F1FF; --muted:#ABA5D8; --dim:#7C76AE;
  --gold:#FFC83D; --gold-ink:#3A2600; --cyan:#4FE3E0; --pink:#FF77AE; --green:#5BE37D; --red:#FF6B6B; --orange:#FF9F43;
  --f-hud:"Silkscreen","Courier New",monospace;
  --f-display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tabh:68px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(1px 1px at 12% 18%,rgba(255,255,255,.5),transparent 60%),radial-gradient(1px 1px at 78% 8%,rgba(255,255,255,.4),transparent 60%),radial-gradient(1.5px 1.5px at 42% 64%,rgba(255,255,255,.25),transparent 60%),radial-gradient(1px 1px at 88% 52%,rgba(255,255,255,.35),transparent 60%),radial-gradient(1px 1px at 22% 82%,rgba(255,255,255,.3),transparent 60%),linear-gradient(180deg,var(--bg2),var(--bg) 420px);
  background-attachment:fixed;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  padding-block:14px calc(var(--tabh) + 100px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;display:grid;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1;font-weight:700}
p{margin:0}
.hud{font-family:var(--f-hud);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--cyan)}
button:focus-visible,input:focus-visible,a:focus-visible,label:focus-within{outline:2px solid var(--cyan);outline-offset:2px}
.panel{background:var(--panel);border:2px solid var(--edge);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0;box-shadow:inset 0 2px 0 rgba(255,255,255,.06),0 4px 0 var(--shadow)}
.admin-users{display:grid;gap:8px}
.admin-user{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--edge)}
.admin-user:last-child{border-bottom:0}
.admin-user-info{min-width:0;display:grid;gap:2px}
.admin-user-info b{overflow-wrap:anywhere}
.admin-user-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:520px){.admin-user{grid-template-columns:1fr}.admin-user-actions{justify-content:flex-start}}
.ptitle{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.ptitle h3{font-size:17px;letter-spacing:.01em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.muted{color:var(--muted)}

/* Chunky game buttons */
.gbtn{border:2px solid var(--edge-hi);background:var(--panel2);border-radius:12px;padding:10px 14px;font-family:var(--f-display);font-weight:700;font-size:15px;min-height:46px;box-shadow:0 4px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.gbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.gbtn.gold{background:var(--gold);border-color:#FFE08A;color:var(--gold-ink);box-shadow:0 4px 0 #A87A00}
.gbtn.gold:active{box-shadow:0 1px 0 #A87A00}
.gbtn.green{background:var(--green);border-color:#A5F5B8;color:#0B2A14;box-shadow:0 4px 0 #23843F}
.gbtn.red{background:#3B2448;border-color:var(--red);color:var(--red)}
.gbtn.cyan{background:#123A46;border-color:var(--cyan);color:var(--cyan)}
.gbtn[disabled]{opacity:.4;cursor:default;transform:none}
.gbtn.big{font-size:18px;min-height:56px;width:100%}

/* Masthead */
.mast{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-family:var(--f-hud);font-size:15px;letter-spacing:.08em;color:var(--gold);text-shadow:0 2px 0 #7A5200}
.logo b{color:var(--cyan);font-weight:400;text-shadow:0 2px 0 #13605E}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;min-width:0;max-width:60%}
.who img{width:24px;height:24px;border-radius:50%;flex:none;border:2px solid var(--gold)}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gate{background:#3A2A12;border:2px solid var(--gold);border-radius:14px;padding:16px;display:grid;gap:6px}
.gate h2{font-size:18px}
.gate p{font-size:14px;color:var(--muted)}

/* Player HUD */
.player-hud{grid-template-columns:auto 1fr;align-items:center;gap:14px;background:linear-gradient(135deg,#2E2766,#221D4E)}
.avatar{width:72px;height:72px;border-radius:50%;position:relative;flex:none;border:3px solid var(--gold);background:var(--bg) center/cover no-repeat;box-shadow:0 0 0 4px rgba(255,200,61,.15)}
.lvbadge{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);font-family:var(--f-hud);font-size:11px;padding:2px 7px;border-radius:6px;white-space:nowrap;box-shadow:0 2px 0 #A87A00}
.pname{font-family:var(--f-display);font-weight:700;font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptitle-tag{font-family:var(--f-hud);font-size:11px;color:var(--gold);letter-spacing:.06em}
.xpbar{height:14px;background:var(--shadow);border:2px solid var(--edge);border-radius:8px;overflow:hidden;position:relative;margin-top:6px}
.xpbar i{display:block;height:100%;background:linear-gradient(180deg,#9BF7F5,var(--cyan) 50%,#2BB8B5);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.xpbar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 18px,rgba(11,9,32,.55) 18px 20px)}
.xptext{display:flex;justify-content:space-between;gap:8px;margin-top:4px;font-family:var(--f-hud);font-size:10.5px;color:var(--muted)}
.statrow{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--shadow);border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:8px;min-width:0}
.stat svg{width:22px;height:22px;flex:none}
.stat b{display:block;font-family:var(--f-display);font-size:18px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);white-space:nowrap}

/* Quests */
.quest{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:2px dashed var(--edge)}
.quest:first-of-type{border-top:0}
.qbox{width:28px;height:28px;border-radius:8px;border:2px solid var(--edge-hi);display:grid;place-items:center;background:var(--shadow)}
.quest.done .qbox{background:var(--green);border-color:#A5F5B8;color:#0B2A14}
.qbox svg{width:16px;height:16px}
.qname{font-weight:700;font-size:14.5px}
.qbar{height:6px;border-radius:99px;background:var(--shadow);overflow:hidden;margin-top:5px}
.qbar i{display:block;height:100%;background:var(--gold)}
.quest.done .qbar i{background:var(--green)}
.reward{font-family:var(--f-hud);font-size:10.5px;color:var(--gold);background:rgba(255,200,61,.12);border:1px solid rgba(255,200,61,.4);padding:3px 7px;border-radius:6px;white-space:nowrap}
.quest.done .reward{color:var(--green);background:rgba(91,227,125,.12);border-color:rgba(91,227,125,.4)}
.allclear{background:linear-gradient(90deg,rgba(91,227,125,.18),rgba(79,227,224,.12));border:2px solid var(--green);border-radius:10px;padding:8px 12px;font-family:var(--f-hud);font-size:11.5px;color:var(--green);text-align:center}

/* Training */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.tchip{flex:none;border:2px solid var(--edge);background:var(--shadow);border-radius:10px;padding:7px 12px;font-size:13.5px;font-weight:700;min-height:40px;color:var(--muted)}
.tchip[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan);background:#123A46}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick .gbtn{font-size:14px;padding:8px 4px}
.clock{font-family:var(--f-hud);font-size:34px;color:var(--cyan);text-shadow:0 0 18px rgba(79,227,224,.45);font-variant-numeric:tabular-nums;line-height:1}
.goalpick{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.goalpick button{border:2px solid var(--edge);background:var(--shadow);border-radius:8px;padding:3px 9px;font-family:var(--f-hud);font-size:11px;color:var(--muted);min-height:32px}
.goalpick button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.entries{display:grid}
.entry{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:2px dashed var(--edge);font-size:14px}
.entry:first-child{border-top:0}
.entry b{font-family:var(--f-display);color:var(--cyan)}
.next{background:linear-gradient(135deg,#123A46,#1B2B5A);border-color:var(--cyan)}
.next .hud{color:var(--cyan)}

/* Co-op */
.coop{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;background:linear-gradient(135deg,#3D1D47,#2A1B4E);border:2px solid var(--pink);border-radius:14px;padding:12px 16px;box-shadow:0 4px 0 var(--shadow)}
.coop .hud{color:var(--pink)}
.coop b{font-family:var(--f-display);font-size:20px;color:var(--ink)}
.coop .lbl{font-size:13px;color:#FFC7DD}
.hearts{display:flex;gap:4px;margin-left:auto}
.hearts svg{width:18px;height:18px}

/* World map */
.map{position:relative;height:calc(var(--n) * 108px + 20px)}
.map svg.path{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:4px;background:none;border:0;padding:0}
.orb{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-hud);font-size:16px;background:var(--panel2);border:3px solid var(--edge-hi);box-shadow:0 5px 0 var(--shadow),inset 0 -6px 0 rgba(0,0,0,.25);position:relative;transition:transform .12s}
.node:active .orb{transform:translateY(3px)}
.orb.prog{border-color:var(--cyan);color:var(--cyan)}
.orb.done{background:var(--gold);border-color:#FFE08A;color:var(--gold-ink)}
.orb.boss{width:82px;height:82px;background:#3B1E36;border-color:var(--red);color:var(--red);font-size:13px}
.orb.boss.done{background:var(--gold);border-color:#FFE08A;color:var(--gold-ink)}
.orb .here{position:absolute;top:-10px;right:-10px;background:var(--pink);color:#3A0A1E;font-size:9.5px;padding:2px 5px;border-radius:5px}
.stars{display:flex;gap:2px}
.stars svg{width:15px;height:15px}
.nlabel{position:absolute;top:50%;transform:translateY(-62%);width:max-content;max-width:min(150px,38vw);font-family:var(--f-display);font-weight:600;font-size:14px;line-height:1.2;text-align:left;display:grid;gap:2px}
.nlabel .hud{font-size:10px}
.nlabel.l{right:calc(100% + 14px);text-align:right}
.nlabel.r{left:calc(100% + 14px)}

/* Mission screen */
.back{justify-self:start;background:none;border:0;color:var(--cyan);font-family:var(--f-hud);font-size:12px;padding:8px 0;min-height:40px}
.mhead{background:linear-gradient(135deg,#2E2766,#221D4E)}
.mhead h2{font-size:clamp(24px,6vw,32px)}
.mhead p{color:var(--muted)}
.mprog{display:flex;align-items:center;gap:10px}
.mprog .xpbar{flex:1;margin:0}
.loot{display:grid;gap:8px}
.litem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--shadow);border:2px solid var(--edge);border-radius:12px;padding:10px 12px}
.litem.done{border-color:rgba(91,227,125,.5)}
.licon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.licon.yt{background:#E53935;color:#fff}
.licon.doc{background:#2B4FD8;color:#fff}
.licon svg{width:18px;height:18px}
.ltext{min-width:0;display:grid;gap:2px}
.ltext a{color:var(--ink);font-weight:700;text-decoration:none;line-height:1.3;overflow-wrap:anywhere}
.ltext a:hover{text-decoration:underline}
.litem.done .ltext a{color:var(--muted)}
.ltext span{font-family:var(--f-hud);font-size:10px;color:var(--dim)}
.claim{border:2px solid var(--gold);background:rgba(255,200,61,.1);color:var(--gold);border-radius:10px;font-family:var(--f-hud);font-size:10.5px;padding:6px 8px;min-height:40px;min-width:64px}
.litem.done .claim{border-color:var(--green);color:var(--green);background:rgba(91,227,125,.1)}
.intel ul{margin:0;padding-left:18px;display:grid;gap:6px;color:var(--muted)}
.intel li::marker{color:var(--gold)}
details.intel summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-weight:700;font-size:17px}
details.intel summary::-webkit-details-marker{display:none}
details.intel summary::after{content:"+";font-family:var(--f-hud);color:var(--gold)}
details.intel[open] summary::after{content:"-"}
.bcard{background:linear-gradient(160deg,#352E74,#241F55);border:3px solid var(--edge-hi);border-radius:16px;padding:18px;display:grid;gap:14px;min-height:200px;align-content:start;box-shadow:0 6px 0 var(--shadow)}
.bcard.revealed{border-color:var(--cyan)}
.bcard .q{font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1.3}
.bcard .a{border-top:2px dashed var(--edge-hi);padding-top:12px;white-space:pre-line}
.state{font-family:var(--f-hud);font-size:10.5px}
.state.got{color:var(--green)} .state.again{color:var(--orange)} .state.new{color:var(--dim)}
.skills{display:grid;gap:8px}
.skill{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--shadow);border:2px solid var(--edge);border-radius:12px;padding:12px;cursor:pointer}
.skill input{appearance:none;-webkit-appearance:none;width:26px;height:26px;border:2px solid var(--edge-hi);border-radius:8px;margin:0;display:grid;place-items:center;background:var(--panel)}
.skill input:checked{background:var(--green);border-color:#A5F5B8}
.skill input:checked::after{content:"";width:7px;height:12px;border:solid #0B2A14;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.skill.done{border-color:rgba(91,227,125,.5)}
.skill.done span.t{color:var(--muted)}
.skill .reward{align-self:center}

/* Party */
.party{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.pcard.me{border-color:var(--gold)}
.pcard.mate{border-color:var(--pink)}
.ptop{display:flex;gap:12px;align-items:center}
.ptop .avatar{width:48px;height:48px;border-width:2px}
.ptop .lvbadge{font-size:9.5px;bottom:-7px}
.pcard.mate .avatar{border-color:var(--pink)}
.pill{margin-left:auto;font-family:var(--f-hud);font-size:10px;padding:3px 7px;border-radius:6px;white-space:nowrap;flex:none}
.pill.good{background:rgba(91,227,125,.15);color:var(--green)} .pill.warn{background:rgba(255,159,67,.15);color:var(--orange)} .pill.bad{background:rgba(255,107,107,.15);color:var(--red)}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pstats div{background:var(--shadow);border-radius:8px;padding:6px 8px}
.pstats b{display:block;font-family:var(--f-display);font-size:16px}
.pstats span{font-size:10.5px;color:var(--muted)}
.pnote{font-style:italic;color:#FFC7DD;font-size:14px;border-left:3px solid var(--pink);padding-left:10px;overflow-wrap:anywhere}
.field{display:grid;gap:4px}
.field input{width:100%;font:inherit;font-size:15px;background:var(--shadow);color:var(--ink);border:2px solid var(--edge);border-radius:10px;padding:10px 12px;min-height:46px}
.empty-mate{border:2px dashed var(--pink);border-radius:14px;padding:16px;color:#FFC7DD;font-size:14px;display:grid;align-content:center;gap:4px;text-align:center}
.empty-mate b{font-family:var(--f-display);color:var(--ink);font-size:16px}
.heat{display:grid;grid-template-columns:64px 1fr;gap:6px 10px;align-items:center;font-size:13px}
.heat .cells{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.heat .cells i{aspect-ratio:1;border-radius:3px;background:var(--shadow);display:block}
.heat .cells i.l1{background:#5C4A1A}.heat .cells i.l2{background:#B88A1E}.heat .cells i.l3{background:var(--gold)}
.heat .cells.mate i.l1{background:#5A2140}.heat .cells.mate i.l2{background:#B04577}.heat .cells.mate i.l3{background:var(--pink)}
.heat .who2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.bars{display:grid;gap:10px}
.bar .top{display:flex;justify-content:space-between;font-size:13.5px;gap:8px}
.bar .top span:last-child{font-family:var(--f-hud);font-size:10.5px;color:var(--muted)}
.track{display:grid;gap:3px;margin-top:4px}
.track i{display:block;height:8px;border-radius:4px;min-width:3px}
.track i.me{background:var(--gold)} .track i.mate{background:var(--pink)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--gold)}
.legend span.mate::before{background:var(--pink)}
.pact{background:linear-gradient(135deg,#3D1D47,#2A1B4E);border-color:var(--pink)}
.pact .hud{color:var(--pink)}

/* Trophies */
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.trophy{background:var(--panel);border:2px solid var(--edge);border-radius:14px;padding:14px 12px;display:grid;justify-items:center;text-align:center;gap:6px;box-shadow:0 4px 0 var(--shadow)}
.trophy .medal{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--shadow);border:3px solid var(--edge)}
.trophy .medal svg{width:28px;height:28px}
.trophy b{font-family:var(--f-display);font-size:15px}
.trophy span{font-size:12px;color:var(--muted);line-height:1.35}
.trophy.on{border-color:var(--gold);background:linear-gradient(160deg,#3A3170,#262052)}
.trophy.on .medal{background:var(--gold);border-color:#FFE08A;color:var(--gold-ink)}
.trophy.on.love{border-color:var(--pink)}
.trophy.on.love .medal{background:var(--pink);border-color:#FFC7DD;color:#3A0A1E}
.trophy:not(.on){opacity:.55}
.trophy:not(.on) .medal{color:var(--dim)}
.rules{display:grid;gap:8px}
.rule{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:2px dashed var(--edge);font-size:14px}
.rule:first-child{border-top:0}
.rule b{font-family:var(--f-hud);font-size:11px;color:var(--gold);white-space:nowrap}
.signoff{text-align:center;font-family:var(--f-hud);font-size:11px;color:var(--dim)}
.signoff span{color:var(--pink)}
.note{font-size:13px;color:var(--muted);text-align:center}
.note.err{color:var(--red)}

/* Dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;gap:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock>*{pointer-events:auto;max-width:720px;width:100%;margin:0 auto}
.timerbar{background:#0F2F38;border:2px solid var(--cyan);border-radius:14px;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 var(--shadow),0 0 24px rgba(79,227,224,.25)}
.timerbar .t{font-family:var(--f-hud);font-size:18px;color:var(--cyan);font-variant-numeric:tabular-nums}
.timerbar .topic{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.timerbar button{border:0;border-radius:10px;padding:8px 10px;font-weight:800;font-size:13px;min-height:40px;background:rgba(255,255,255,.08);color:var(--ink)}
.timerbar button.stop{background:var(--gold);color:var(--gold-ink)}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--red);flex:none;box-shadow:0 0 8px var(--red);animation:pl 1.2s ease-in-out infinite}
.paused .pulse{animation:none;opacity:.35;box-shadow:none}
@keyframes pl{50%{opacity:.2}}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border:2px solid var(--edge-hi);border-radius:18px;height:var(--tabh);box-shadow:0 4px 0 var(--shadow),0 10px 30px rgba(0,0,0,.4);overflow:hidden}
.tab{border:0;background:none;display:grid;place-content:center;justify-items:center;gap:3px;font-family:var(--f-hud);font-size:9.5px;color:var(--dim);letter-spacing:.04em}
.tab svg{width:24px;height:24px}
.tab[aria-current="true"]{color:var(--gold);background:rgba(255,200,61,.08)}

/* Chat */
.chatwrap{display:grid;gap:12px}
.chatlog{background:var(--shadow);border:2px solid var(--edge);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:260px;max-height:calc(100dvh - 380px);overflow-y:auto;overscroll-behavior:contain}
.msg{display:grid;gap:3px;max-width:82%}
.msg .bub{padding:9px 12px;border-radius:14px;font-size:15px;line-height:1.4;overflow-wrap:anywhere;white-space:pre-wrap}
.msg .meta{font-family:var(--f-hud);font-size:9.5px;color:var(--dim)}
.msg.me{align-self:flex-end;justify-items:end}
.msg.me .bub{background:var(--gold);color:var(--gold-ink);border-bottom-right-radius:4px}
.msg.them{align-self:flex-start}
.msg.them .bub{background:#4A2350;color:#FFE3EE;border:2px solid var(--pink);border-bottom-left-radius:4px}
.msg.emote .bub{font-family:var(--f-hud);font-size:13px;letter-spacing:.04em}
.msg.me.emote .bub{background:#123A46;color:var(--cyan);border:2px solid var(--cyan)}
.daysep{align-self:center;font-family:var(--f-hud);font-size:9.5px;color:var(--dim);padding:2px 8px;border:1px solid var(--edge);border-radius:6px}
.chatempty{margin:auto;text-align:center;color:var(--muted);font-size:14px;display:grid;gap:4px;justify-items:center}
.chatempty b{font-family:var(--f-display);color:var(--ink);font-size:16px}
.emotes{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.emotes::-webkit-scrollbar{display:none}
.emotes button{flex:none;border:2px solid var(--edge-hi);background:var(--panel2);border-radius:10px;padding:6px 10px;font-family:var(--f-hud);font-size:11px;color:var(--ink);min-height:38px;box-shadow:0 3px 0 var(--shadow)}
.emotes button.love{border-color:var(--pink);color:var(--pink)}
.composer{display:grid;grid-template-columns:1fr auto;gap:8px}
.composer input{width:100%;font:inherit;font-size:16px;background:var(--shadow);color:var(--ink);border:2px solid var(--edge-hi);border-radius:12px;padding:10px 12px;min-height:48px}
.composer .gbtn{min-height:48px}
.tab{position:relative}
.tbadge{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--pink);color:#3A0A1E;font-family:var(--f-body);font-weight:800;font-size:11px;display:grid;place-items:center;letter-spacing:0}

/* Quiz duels */
.sheetwrap{position:fixed;inset:0;z-index:35;display:grid;align-items:end;justify-items:center;background:rgba(8,6,24,.78);padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.qsheet{background:linear-gradient(160deg,#352E74,#221D4E);border:3px solid var(--gold);border-radius:20px;padding:18px;display:grid;gap:10px;max-width:520px;width:100%;box-shadow:0 0 50px rgba(255,200,61,.25)}
.qsheet h3{font-size:22px}
.wrapchips{flex-wrap:wrap;overflow:visible}
.srcpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.srcopt{display:grid;gap:2px;text-align:left;border:2px solid var(--edge);background:var(--shadow);border-radius:12px;padding:10px 12px;color:var(--ink)}
.srcopt b{font-family:var(--f-display);font-size:15px}
.srcopt span{font-size:12px;color:var(--muted);line-height:1.35}
.srcopt[aria-pressed="true"]{border-color:var(--cyan);background:#123A46}
.srcopt[disabled]{opacity:.45;cursor:default}
.amsg{color:var(--red);background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.4);border-radius:10px;padding:8px 12px;font-size:14px}
.qprog{display:flex;gap:4px}
.qprog i{flex:1;height:8px;border-radius:4px;background:var(--shadow);border:1px solid var(--edge)}
.qprog i.ok{background:var(--green);border-color:var(--green)}
.qprog i.no{background:var(--red);border-color:var(--red)}
.qprog i.cur{background:var(--gold);border-color:var(--gold)}
.qcard{min-height:150px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;border:2px solid var(--edge-hi);background:var(--panel2);border-radius:14px;padding:12px 14px;font-size:15.5px;font-weight:700;color:var(--ink);min-height:56px;box-shadow:0 4px 0 var(--shadow);transition:transform .08s}
.opt:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.opt .key{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--shadow);font-family:var(--f-hud);font-size:13px;color:var(--gold)}
.opt.right{border-color:var(--green);background:#16402A}
.opt.right .key{background:var(--green);color:#0B2A14}
.opt.wrong{border-color:var(--red);background:#4A1E2A;animation:shake .3s}
.opt.wrong .key{background:var(--red);color:#3A0A0A}
.opt.fade{opacity:.45}
.opt[disabled]{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb-ok{border-color:var(--green)} .fb-ok .hud{color:var(--green)}
.fb-no{border-color:var(--red)} .fb-no .hud{color:var(--red)}
.results{text-align:center;justify-items:center;background:linear-gradient(160deg,#3A3170,#221D4E);border-color:var(--gold)}
.results .big{font-family:var(--f-hud);font-size:26px;color:var(--gold);text-shadow:0 3px 0 #7A5200;line-height:1.2}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;width:100%}
.vs .side{background:var(--shadow);border-radius:12px;padding:10px;display:grid;gap:2px;border:2px solid var(--gold)}
.vs .side.them{border-color:var(--pink)}
.vs .side b{font-family:var(--f-display);font-size:28px}
.vsx{font-family:var(--f-hud);color:var(--muted)}
.review{display:grid;gap:8px}
.rv{display:grid;gap:3px;background:var(--shadow);border-left:4px solid var(--green);border-radius:8px;padding:10px 12px;font-size:14px}
.rv.no{border-left-color:var(--red)}
.rv span{font-size:13px;color:var(--muted)}
.qinvite{display:grid!important;gap:4px;background:linear-gradient(160deg,#352E74,#241F55)!important;color:var(--ink)!important;border:2px solid var(--gold)!important;min-width:220px}
.msg.them .qinvite{border-color:var(--pink)!important}
.qinvite b{font-family:var(--f-display);font-size:17px}
.qinvite > span:not(.hud){font-size:12.5px;color:var(--muted)}
.qinvite .qscores{display:flex;gap:12px;font-family:var(--f-hud);font-size:10.5px;color:var(--cyan)!important}
.qinvite .gbtn{margin-top:4px;min-height:40px;font-size:14px}
.emotes button.duel{border-color:var(--gold);background:var(--gold);color:var(--gold-ink);box-shadow:0 3px 0 #A87A00}

/* Heroes + arena */
.crest{position:relative;display:grid;place-items:center;flex:none;border-radius:14px 14px 50% 50%/14px 14px 38% 38%;background:linear-gradient(160deg,color-mix(in srgb,var(--hc) 38%,#1C1840),#15122E);border:3px solid var(--hc);box-shadow:0 4px 0 var(--shadow),inset 0 0 18px color-mix(in srgb,var(--hc) 30%,transparent);color:var(--hc)}
.crest svg{width:46%;height:46%}
.crest .ini{position:absolute;bottom:-7px;right:-7px;background:var(--hc);color:#15122E;font-family:var(--f-hud);font-size:10px;padding:1px 5px;border-radius:6px;box-shadow:0 2px 0 var(--shadow)}
.crest.empty{--hc:#463F8E;color:var(--dim);font-family:var(--f-hud)}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.hero{background:var(--panel);border:2px solid var(--edge);border-radius:16px;padding:14px;display:grid;gap:10px;box-shadow:0 4px 0 var(--shadow)}
.hero.cur{border-color:var(--hc);box-shadow:0 4px 0 var(--shadow),0 0 24px color-mix(in srgb,var(--hc) 35%,transparent)}
.hero.locked{opacity:.55}
.hname{font-family:var(--f-display);font-size:18px;display:block;line-height:1.15}
.hskills{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.hskills li{display:grid;grid-template-columns:1fr auto;gap:2px 8px;background:var(--shadow);border-radius:10px;padding:7px 10px;border:1px solid var(--edge)}
.hskills li b{font-size:13.5px}
.hskills li span{grid-column:1;font-size:12px;color:var(--muted)}
.hskills li em{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-size:9.5px;color:var(--dim)}
.hskills li.on{border-color:color-mix(in srgb,var(--hc,#5BE37D) 60%,transparent)}
.hskills li.on em{color:var(--green)}
.lockmsg{text-align:center;padding:8px;border:2px dashed var(--edge);border-radius:10px}
.herocard{border-color:var(--hc);background:linear-gradient(150deg,color-mix(in srgb,var(--hc) 18%,#2E2766),#221D4E)}
.battle .fighter{display:flex;gap:12px;align-items:center;background:var(--panel);border:2px solid var(--edge);border-radius:14px;padding:10px 12px;box-shadow:0 4px 0 var(--shadow)}
.fighter.opp{border-color:var(--pink)} .fighter.me{border-color:var(--gold)}
.fmeta{flex:1;min-width:0;display:grid;gap:4px}
.fmeta b{font-family:var(--f-display);font-size:16px}
.fmeta .hud{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hpnum{font-family:var(--f-hud);font-size:14px;color:var(--ink)}
.hpbar{height:14px;border-radius:7px;background:var(--shadow);border:2px solid var(--edge);overflow:hidden}
.hpbar i{display:block;height:100%;background:linear-gradient(180deg,#9BF5AE,var(--green));transition:width .7s cubic-bezier(.2,.8,.2,1)}
.hpbar i.mid{background:linear-gradient(180deg,#FFE08A,var(--gold))}
.hpbar i.low{background:linear-gradient(180deg,#FF9C9C,var(--red))}
.timer{height:8px;border-radius:4px;background:var(--shadow);overflow:hidden}
.timer i{display:block;height:100%;background:var(--cyan);transition:width .2s linear}
.timer i.low{background:var(--red)}
.skillbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.skillbtn{display:grid;gap:2px;text-align:left;border:2px solid var(--edge-hi);background:#1F1A48;border-radius:12px;padding:8px 10px;color:var(--ink);box-shadow:0 3px 0 var(--shadow)}
.skillbtn b{font-family:var(--f-display);font-size:14px;color:var(--gold)}
.skillbtn span{font-size:11.5px;color:var(--muted);line-height:1.3}
.skillbtn.armed{border-color:var(--gold);background:#3A2E0E;box-shadow:0 0 16px rgba(255,200,61,.45)}
.skillbtn[disabled]{opacity:.4;cursor:default}
.opt.hinted{border-color:var(--cyan);box-shadow:0 0 16px rgba(79,227,224,.5)}
.turnres ul{margin:0;padding-left:18px;display:grid;gap:4px}
.turnres li.mine{color:var(--ink)} .turnres li.theirs{color:#FFC7DD}
.turnres li.ev-hit::marker{content:"⚔ "} .turnres li.ev-block::marker{content:"⛨ "}
.waitpanel{text-align:center;justify-items:center}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--cyan);animation:pl 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
.battleinv{border-color:var(--orange)!important}

/* Pixel emblems + battle FX */
.crest .pix{width:64%;height:64%;display:block;animation:bob 1.6s steps(2) infinite;image-rendering:pixelated}
.crest .pix svg{width:100%;height:100%;display:block}
@keyframes bob{50%{transform:translateY(-2px)}}
.crest.lunge{animation:lunge .35s ease-out}
.fighter.opp .crest.lunge{animation:lunge-down .35s ease-out}
@keyframes lunge{40%{transform:translateY(-14px) scale(1.12)}}
@keyframes lunge-down{40%{transform:translateY(14px) scale(1.12)}}
.fighter{position:relative}
.fighter.shake{animation:shk .35s}
.fighter.shake-hard{animation:shk2 .45s}
@keyframes shk{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@keyframes shk2{15%,55%{transform:translate(-9px,3px)}35%,75%{transform:translate(9px,-3px)}}
.fighter.flash::after{content:"";position:absolute;inset:-2px;border-radius:14px;background:var(--flash);opacity:0;animation:fl2 .45s}
@keyframes fl2{30%{opacity:.35}}
.fxcanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:33}
.fxnum{position:fixed;z-index:34;transform:translate(-50%,-50%);font-family:var(--f-hud);font-size:20px;color:#FF6B6B;text-shadow:0 3px 0 #3A0A0A,0 0 12px rgba(255,107,107,.6);pointer-events:none;white-space:nowrap;animation:fxup 1.2s ease-out forwards}
.fxnum.big{font-size:28px;color:var(--gold);text-shadow:0 3px 0 #7A5200,0 0 18px rgba(255,200,61,.7)}
.fxnum.heal{color:var(--green);text-shadow:0 3px 0 #0B2A14}
.fxnum.block{color:#9CC4FF;text-shadow:0 3px 0 #10224A}
.fxnum.fire{color:var(--orange);text-shadow:0 3px 0 #4A1E00}
.fxnum.ice{color:#BFE6FF;text-shadow:0 3px 0 #0E2A3A}
.fxnum.self{color:var(--muted);font-size:15px;text-shadow:0 2px 0 var(--shadow)}
@keyframes fxup{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-family:var(--f-hud);font-size:9.5px;padding:2px 6px;border-radius:5px;background:var(--shadow)}
.tag.fire{color:var(--orange)} .tag.heal{color:var(--green)} .tag.mute{color:var(--muted)} .tag.ice{color:#BFE6FF}
.skillbar{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
@media (max-width:420px){.skillbar{grid-template-columns:1fr 1fr}.skillbtn span{font-size:10.5px}}
@media (prefers-reduced-motion:reduce){.crest .pix{animation:none}}

/* Coins, shop, items, sound */
.coins{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-display);font-weight:700;color:var(--gold)}
.coins svg{width:18px;height:18px;flex:none}
.gbtn .coins{color:inherit}
.gbtn.gold .coins b{color:var(--gold-ink)}
.shophead{background:linear-gradient(150deg,#3A2E0E,#221D4E);border-color:var(--gold)}
.bal{display:grid;justify-items:end;gap:2px}
.bal .coins{font-size:26px}.bal .coins svg{width:26px;height:26px}
.shoplist{display:grid;gap:8px}
.shopitem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--shadow);border:2px solid var(--edge);border-radius:12px;padding:10px 12px}
.si-text{display:grid;gap:2px;min-width:0}
.si-text b{font-family:var(--f-display);font-size:15px}
.si-text span{font-size:12.5px;color:var(--muted);line-height:1.35}
.si-text em{font-style:normal;font-size:9.5px;color:var(--cyan)}
.sicon{width:40px;height:40px;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--edge-hi);border-radius:10px;flex:none}
.sicon svg{width:26px;height:26px;image-rendering:pixelated}
.itembar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.itembtn{display:flex;align-items:center;gap:8px;border:2px solid var(--edge-hi);background:#1F1A48;border-radius:12px;padding:5px 10px 5px 5px;color:var(--ink);box-shadow:0 3px 0 var(--shadow);min-height:44px}
.itembtn .sicon{width:32px;height:32px}.itembtn .sicon svg{width:20px;height:20px}
.itembtn b{font-size:13px}
.itembtn em{font-style:normal;font-family:var(--f-hud);font-size:10px;color:var(--gold)}
.itembtn.armed{border-color:var(--green);background:#16402A;box-shadow:0 0 14px rgba(91,227,125,.4)}
.itembtn[disabled]{opacity:.4}
.soundbtn{background:var(--panel);border:2px solid var(--edge);border-radius:10px;width:38px;height:34px;display:grid;place-items:center;color:var(--gold);padding:0;margin-left:auto}
.soundbtn[aria-pressed="false"]{color:var(--dim)}
.soundbtn svg{width:20px;height:20px}
.mast .who{margin-left:0}
.coinfloat{display:flex;align-items:center;gap:6px;bottom:calc(var(--tabh) + 108px + env(safe-area-inset-bottom,0px));animation-delay:.1s}
.coinfloat svg{width:22px;height:22px}

/* Roadmap, tracker, certification */
.phases{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.phase{background:var(--shadow);border:2px solid var(--edge);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.phase.now{border-color:var(--gold);box-shadow:0 0 18px rgba(255,200,61,.18)}
.phase.done{border-color:var(--green)}
.phase b{font-family:var(--f-display);font-size:15px}
.pgoal{font-size:13px;color:var(--muted)}
.tag.now{background:var(--gold);color:var(--gold-ink)}
.pmods{display:flex;gap:6px;flex-wrap:wrap}
.pmod{position:relative;overflow:hidden;border:1px solid var(--edge-hi);background:var(--panel2);border-radius:8px;padding:5px 9px 7px;font-size:12.5px;font-weight:700;color:var(--ink)}
.pmod i{position:absolute;left:0;bottom:0;height:3px;background:var(--cyan)}
.xpbar.slim{height:8px;margin-top:2px}
.appform{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.appform input,.appitem select{font:inherit;font-size:15px;background:var(--shadow);color:var(--ink);border:2px solid var(--edge);border-radius:10px;padding:9px 10px;min-height:44px;min-width:0}
.apps{display:grid;gap:8px}
.appitem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--shadow);border:2px solid var(--edge);border-radius:12px;padding:8px 10px}
.appitem.offer{border-color:var(--gold)} .appitem.rej{opacity:.55}
@media (max-width:440px){.appform{grid-template-columns:1fr}}
.certpanel{border-color:var(--edge-hi)}
.certpanel.ready{border-color:var(--gold);background:linear-gradient(150deg,#3A2E0E,#221D4E)}
.certpanel.done{border-color:var(--green)}
.certpanel h3{font-size:20px}
.certbadge{font-family:var(--f-hud);font-size:10.5px;color:var(--gold-ink);background:var(--gold);padding:3px 8px;border-radius:6px;justify-self:start}
.certificate{background:#FFF7E6;color:#14202B;border-radius:6px;padding:10px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.certin{border:3px solid #B8860B;outline:1px solid #E3A400;outline-offset:-10px;padding:26px 18px;display:grid;gap:10px;text-align:center;justify-items:center}
.certtop{display:grid;gap:8px;justify-items:center}
.certtop .hud{color:#6E4F00}
.certpix{width:64px;height:64px;background:#15122E;padding:8px;border-radius:6px;display:block}
.certpix svg{width:100%;height:100%;display:block}
.certpre,.certbody{font-size:14.5px;max-width:52ch;color:#14202B}
.certname{font-family:var(--f-display);font-size:clamp(28px,7vw,42px);color:#14202B;border-bottom:2px solid #E3A400;padding-bottom:4px}
.certtitle{font-family:var(--f-display);color:#B8860B;font-size:clamp(18px,4.5vw,24px)}
.certmeta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;margin-top:6px}
.certmeta span{display:grid;gap:2px;font-weight:700;font-size:13px;overflow-wrap:anywhere}
.certmeta em{font-style:normal;font-family:var(--f-hud);font-size:9.5px;color:#6E4F00}

/* Popups */
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(14px);opacity:0;background:var(--panel2);border:2px solid var(--gold);color:var(--ink);padding:9px 16px;border-radius:12px;font-weight:800;font-size:14px;transition:all .25s ease;pointer-events:none;max-width:calc(100% - 32px);text-align:center;z-index:30;box-shadow:0 4px 0 var(--shadow)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.xpfloat{position:fixed;left:50%;bottom:calc(var(--tabh) + 140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-family:var(--f-hud);font-size:22px;color:var(--gold);text-shadow:0 3px 0 #7A5200,0 0 18px rgba(255,200,61,.6);pointer-events:none;z-index:31;animation:fl 1.1s ease-out forwards}
@keyframes fl{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-50px) scale(1)}}
.lvup{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(8,6,24,.82);padding:24px}
.lvup .box{background:linear-gradient(160deg,#3A3170,#221D4E);border:3px solid var(--gold);border-radius:20px;padding:28px 22px;text-align:center;display:grid;gap:10px;max-width:340px;width:100%;box-shadow:0 0 60px rgba(255,200,61,.35);animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.lvup .big{font-family:var(--f-hud);font-size:28px;color:var(--gold);text-shadow:0 3px 0 #7A5200}
.lvup .rank{font-family:var(--f-display);font-size:24px;font-weight:700}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:400px){.quick{grid-template-columns:repeat(2,1fr)}.pstats{grid-template-columns:repeat(2,1fr)}.statrow .stat{padding:8px}.stat svg{display:none}}

/* Standalone page basics + sign-in screens */
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}

.gate code{font-family:var(--f-hud);font-size:11px;background:var(--shadow);padding:2px 6px;border-radius:4px;color:var(--gold)}
.gate .label{font-family:var(--f-hud);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.aform{display:grid;gap:12px}
.amsg{color:var(--red)!important;background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.4);border-radius:10px;padding:8px 12px}
.linkbtn{background:none;border:0;color:var(--cyan);font-weight:700;padding:8px 0;min-height:40px;font-size:14px}
.signout{background:none;border:2px solid var(--edge);border-radius:8px;padding:2px 8px;font-family:var(--f-hud);font-size:10px;color:var(--muted);min-height:30px}
.who .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<script>
const CFG=window.FDE_CONFIG||{}; const PARTNER=CFG.partnerName||"Player 2";
const YT=v=>"https://www.youtube.com/watch?v="+v;
const MODULES = [
 {id:"role", code:"FDE-01", title:"What an FDE is",
  lead:"An FDE is a software engineer embedded with a customer who ships working solutions on the customer's real data, systems and constraints.",
  watch:[
   {id:"rv1",t:"Forward Deployed Engineer (FDE) Explained",u:YT("yv697SxZRRQ")},
   {id:"rv2",t:"This Is How Forward Deployed Engineering Is Actually Done",u:YT("AD-EmZ3v6-g")},
   {id:"rv3",t:"Should You Become A Forward Deployed Engineer?",u:YT("m6PWOEN5jx4")}],
  read:[
   {id:"rr1",t:"Dev versus Delta: Demystifying engineering roles at Palantir",s:"Palantir blog",u:"https://blog.palantir.com/dev-versus-delta-demystifying-engineering-roles-at-palantir-ad44c2a6e87"},
   {id:"rr2",t:"A Day in the Life of a Palantir Forward Deployed Software Engineer",s:"Palantir blog",u:"https://blog.palantir.com/a-day-in-the-life-of-a-forward-deployed-software-engineer-45ef2de257b1"},
   {id:"rr3",t:"WTF is a forward deployed engineer?",s:"PostHog",u:"https://posthog.com/blog/forward-deployed-engineer"}],
  points:[
   "The pitch: an FDE turns a vague customer problem into running software, then feeds what they learned back to the product team.",
   "Software Engineer builds features for all customers. Solutions Engineer wins the deal with demos. Consultant configures. FDE writes production code and owns the customer outcome end to end.",
   "A typical week: discovery calls, writing pipelines and integrations, debugging in an environment you don't control, demoing progress, writing up product gaps.",
   "Interviewers screen for three things: you code under ambiguity, you talk to executives and engineers on the same day, and you own the outcome without waiting for a spec."],
  cards:[
   {id:"r1",q:"Give the one-line definition of an FDE.",a:"An engineer embedded with a customer who turns a vague problem into running software, then feeds learnings back to the product team."},
   {id:"r2",q:"How is an FDE different from a Solutions Engineer?",a:"An SE's job ends at the technical win. An FDE writes production code and owns the customer's outcome after the deal, end to end."},
   {id:"r3",q:"Name the three things FDE interviewers screen for.",a:"1. Coding under ambiguity\n2. Talking to execs and engineers in the same afternoon\n3. Owning the outcome without a spec"}],
  checks:[{id:"rc1",t:"I can explain the FDE role and how it differs from SE and consulting in 60 seconds"}]},
 {id:"loop", code:"FDE-02", title:"The interview loop",
  lead:"Most loops run five to six rounds, and every round scores technical depth and customer handling at the same time.",
  watch:[
   {id:"lv1",t:"How to Become a Forward Deployed Engineer in 2026",u:YT("vLlIBT0HSSc")},
   {id:"lv2",t:"What is a Forward Deployed Engineer? Complete Skills & Technical Roadmap",u:YT("UiO735D6Z4E")}],
  read:[
   {id:"lr1",t:"What is a forward deployed engineer? A complete guide",s:"Paraform",u:"https://www.paraform.com/insights/what-is-a-forward-deployed-engineer"},
   {id:"lr2",t:"Inside Tech's Hottest New Job, and How to Prepare for It",s:"Illinois Tech",u:"https://www.iit.edu/blog/forward-deployed-engineer"}],
  points:[
   "Recruiter screen: motivation, travel and client-facing comfort, compensation.",
   "Technical screen: practical Python or SQL, 45–60 minutes. Data wrangling and API calls, not puzzle algorithms.",
   "Decomposition case: break an open customer problem into a buildable plan.",
   "System design: an integration, pipeline or LLM app end to end, with trade-offs stated.",
   "Take-home or live build: working beats elegant. Add a short README with your assumptions.",
   "Behavioral and hiring manager: ownership, ambiguity, conflict with a customer, how you prioritise.",
   "Three habits for every round: clarify then restate the problem, think out loud with trade-offs, close with your next step and what you'd tell the product team."],
  cards:[
   {id:"l1",q:"What do FDE coding screens usually test?",a:"Practical data and integration work in Python or SQL: parsing messy input, calling APIs, wrangling data. Not competitive-programming puzzles."},
   {id:"l2",q:"What are the three habits that score points in every round?",a:"1. Ask clarifying questions, then restate the problem in one sentence\n2. Think out loud and name trade-offs\n3. Close with next steps and what you'd tell the product team"},
   {id:"l3",q:"In a take-home, what matters more: working or elegant?",a:"Working. Ship something that runs, and write a short README listing your assumptions and what you'd do next."}],
  checks:[
   {id:"lc1",t:"My 60-second answer to \"Why FDE, why now, why you?\" is ready"},
   {id:"lc2",t:"I have three questions ready for the interviewer"},
   {id:"lc3",t:"I've researched the target company's product, customers and recent launches"}]},
 {id:"tech", code:"FDE-03", title:"Technical core",
  lead:"Your Salesforce, HubSpot and Cin7 integration work is the right muscle. The gap to close is writing it by hand in Python and SQL.",
  watch:[
   {id:"tv1",t:"What is a REST API? (in 2 Minutes)",u:YT("WRsKs-K6iII")},
   {id:"tv2",t:"OAuth 2.0 explained with examples",u:YT("ZDuRmhLSLOY")},
   {id:"tv3",t:"SQL Window Functions Basics (Visually Explained)",u:YT("o666k19mZwE")},
   {id:"tv4",t:"Webhooks vs Polling Explained",u:YT("rY3uBPkA3DU")},
   {id:"tv5",t:"Paginated APIs x Python (PyOhio 2022)",u:YT("RCQhchesRt0")},
   {id:"tv6",t:"System Design Interview: Design a Webhook Service",u:YT("4C9SVQVmUxs")}],
  read:[
   {id:"tr1",t:"An Intro to SQL Window Functions",s:"Toptal",u:"https://www.toptal.com/developers/sql/intro-to-sql-windows-functions"},
   {id:"tr2",t:"SQL window functions explained",s:"Maven Analytics",u:"https://mavenanalytics.io/blog/sql-window-functions-explained"},
   {id:"tr3",t:"HTTP response status codes",s:"MDN Web Docs",u:"https://developer.mozilla.org/en-US/docs/Web/HTTP/Status"},
   {id:"tr4",t:"Requests: HTTP for Humans (documentation)",s:"Python Requests",u:"https://requests.readthedocs.io/en/latest/"}],
  points:[
   "Python: dicts, sets, comprehensions, sorted(key=...), Counter and defaultdict; CSV and JSON parsing that survives bad rows; requests with auth, pagination and retries; basic pandas group, merge and dedupe.",
   "SQL: JOIN types and which rows they drop; GROUP BY with HAVING; CASE WHEN and COALESCE; window functions ROW_NUMBER, RANK, LAG; CTEs to break hard queries into steps.",
   "APIs: status codes 200, 201, 400, 401, 403, 404, 429, 500; idempotency; API keys vs OAuth 2.0 with token refresh.",
   "Sync patterns: full vs incremental sync, upsert by external ID, conflict rules, webhooks vs polling, dead-letter queues, reconciliation reports.",
   "Design template: clarify, sketch the flow (source, ingest, transform, store, serve), pick components and say why, failure modes, security, rollout."],
  cards:[
   {id:"t1",q:"401 vs 403: what's the difference?",a:"401 Unauthorized: you're not authenticated (missing or bad credentials).\n403 Forbidden: you're authenticated but not allowed to do this."},
   {id:"t2",q:"An API returns 429. What do you do?",a:"You hit a rate limit. Back off and retry with exponential delay (respect Retry-After if given), batch requests, and cap total retries."},
   {id:"t3",q:"Webhooks vs polling: when do you use each?",a:"Webhooks push changes in near real time; handle retries, duplicates and verify signatures.\nPolling pulls on a schedule; simpler and reliable when freshness can lag or the source has no webhooks."},
   {id:"t4",q:"Write the SQL idea for the latest order per customer.",a:"ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY created_at DESC) in a CTE, then keep rows where the number = 1."},
   {id:"t5",q:"Why upsert by external ID during a sync?",a:"Re-running the sync updates existing records instead of creating duplicates. It makes the sync idempotent and safe to retry."},
   {id:"t6",q:"Full sync vs incremental sync?",a:"Full: reload everything; simple but slow and heavy.\nIncremental: only records changed since a watermark (updated_at or cursor); fast, but needs reliable change tracking and periodic reconciliation."},
   {id:"t7",q:"List the six steps of the integration design answer.",a:"1. Clarify users, volume, freshness, systems of record\n2. Sketch the flow\n3. Pick components and say why\n4. Failure modes and retries\n5. Security: auth, secrets, PII, audit\n6. Rollout: pilot, measure, expand"}],
  checks:[
   {id:"tc1",t:"I can write a paginated API loop with retries in Python from memory"},
   {id:"tc2",t:"I can write a window-function query for the latest record per group"},
   {id:"tc3",t:"I can dedupe and group a messy CSV in Python without looking anything up"},
   {id:"tc4",t:"I can whiteboard an inventory-to-CRM sync with failure handling"}]},
 {id:"data", code:"", title:"Data pipelines",
  lead:"Most FDE work starts with getting a customer's messy data from where it lives to where it's useful, reliably and repeatably.",
  watch:[
   {id:"pv1",t:"ETL & ELT Explained in 4 minutes",u:YT("WQu6zrSpiOY")},
   {id:"pv2",t:"ETL vs ELT: The Real Difference in Modern Data Pipelines",u:YT("FlLwo99Q568")},
   {id:"pv3",t:"Data Modeling Tutorial: Star Schema (Kimball Approach)",u:YT("gRE3E7VUzRU")}],
  read:[
   {id:"pr1",t:"ETL vs ELT: Key differences explained",s:"dbt Labs",u:"https://www.getdbt.com/blog/etl-vs-elt"},
   {id:"pr2",t:"The difference between ETL and ELT",s:"AWS",u:"https://aws.amazon.com/compare/the-difference-between-etl-and-elt/"},
   {id:"pr3",t:"Data pipelines: key components and best practices",s:"dbt Labs",u:"https://www.getdbt.com/blog/data-pipelines"}],
  points:[
   "ETL transforms data before loading it; ELT loads raw data into the warehouse first and transforms it there. Modern cloud warehouses (Snowflake, BigQuery) favour ELT.",
   "Batch runs on a schedule (nightly, hourly); streaming processes events as they arrive. Pick by how fresh the customer actually needs the data.",
   "Idempotent pipelines can re-run safely: use upserts by a stable key and write by partition so a retry never duplicates rows.",
   "Data modelling: fact tables hold events or transactions; dimension tables hold the things they describe (customer, product, date). That's a star schema.",
   "Data quality checks at every boundary: row counts, nulls in required fields, unique keys, and freshness. Alert when they fail.",
   "Keep raw data untouched so you can rebuild anything downstream when logic changes."],
  cards:[
   {id:"p1",q:"ETL vs ELT in one sentence each?",a:"ETL: transform before loading into the target.\nELT: load raw data first, then transform inside the warehouse."},
   {id:"p2",q:"What makes a pipeline idempotent?",a:"Running it twice gives the same result: upsert by a stable key, overwrite by partition, and never blindly append."},
   {id:"p3",q:"Fact table vs dimension table?",a:"Fact: events or measurements (orders, payments).\nDimension: descriptive context (customer, product, date)."},
   {id:"p4",q:"Batch or streaming for a daily sales report?",a:"Batch. Streaming adds cost and complexity you only need when decisions depend on near real-time data."},
   {id:"p5",q:"Four data-quality checks to add to any pipeline?",a:"Row counts vs expected, nulls in required fields, duplicate keys, and freshness (when did data last arrive)."}],
  checks:[
   {id:"pc1",t:"I can explain ETL vs ELT and when I'd pick each"},
   {id:"pc2",t:"I can sketch a star schema for an orders dataset"},
   {id:"pc3",t:"I can describe how I'd make a nightly sync safe to re-run"}]},
 {id:"cloud", code:"", title:"Cloud and deployment",
  lead:"Job posts list cloud and containers in almost every FDE role. You need to ship your code somewhere real and keep it running.",
  watch:[
   {id:"kv1",t:"Docker in 100 Seconds",u:YT("Gjnup-PuquQ")},
   {id:"kv2",t:"Learn Docker in 7 Easy Steps",u:YT("gAkwW2tuIqE")},
   {id:"kv3",t:"Kubernetes Explained in 100 Seconds",u:YT("PziYflu8cB8")},
   {id:"kv4",t:"DevOps CI/CD Explained in 100 Seconds",u:YT("scEDHsr3APg")}],
  read:[
   {id:"kr1",t:"What is Docker?",s:"Docker Docs",u:"https://docs.docker.com/get-started/docker-overview/"},
   {id:"kr2",t:"What is a container?",s:"Docker Docs",u:"https://docs.docker.com/get-started/docker-concepts/the-basics/what-is-a-container/"},
   {id:"kr3",t:"Continuous Integration",s:"Martin Fowler",u:"https://www.martinfowler.com/articles/continuousIntegration.html"}],
  points:[
   "A container packages your app with its dependencies so it runs the same on your laptop and the customer's server. An image is the recipe; a container is a running copy.",
   "Kubernetes runs and scales many containers, restarts failed ones and rolls out new versions. Many customers already run it; you deploy into it.",
   "CI runs tests on every change; CD ships passing builds automatically. Small, frequent releases are safer than big ones.",
   "Keep secrets (API keys, passwords) out of code: environment variables or a secrets manager, never committed to git.",
   "Environments: dev, staging, production. Test in staging with realistic data before touching production.",
   "Serverless functions suit small, spiky jobs; containers suit long-running services. Know the cost and cold-start trade-offs."],
  cards:[
   {id:"k1",q:"Image vs container?",a:"Image: the read-only template (app + dependencies).\nContainer: a running instance of that image."},
   {id:"k2",q:"What does Kubernetes do for you?",a:"Schedules containers across machines, restarts failed ones, scales them, and rolls out new versions safely."},
   {id:"k3",q:"CI vs CD?",a:"CI: build and test every change automatically.\nCD: automatically deliver or deploy builds that pass."},
   {id:"k4",q:"Where should an API key live?",a:"In an environment variable or a secrets manager, injected at runtime. Never in source code or a git repo."},
   {id:"k5",q:"Serverless or a container for a nightly 2-minute job?",a:"Serverless (or a scheduled job). No server to keep running; you pay only when it runs."}],
  checks:[
   {id:"kc1",t:"I can write a basic Dockerfile and run it locally"},
   {id:"kc2",t:"I can explain how code goes from a commit to production through CI/CD"},
   {id:"kc3",t:"I can explain how I'd handle secrets for a customer deployment"}]},
 {id:"security", code:"", title:"Enterprise security",
  lead:"Enterprise customers won't let you near their data until security says yes. Speaking their language earns trust fast.",
  watch:[
   {id:"ev1",t:"Single Sign-On (SSO) Explained in 10 Minutes",u:YT("5KChrGWFcpk")},
   {id:"ev2",t:"SAML vs. OpenID (OIDC): What's the Difference?",u:YT("A7GVeqFvqFM")},
   {id:"ev3",t:"OAuth2 vs SSO vs SAML",u:YT("FpCWFxdSKHs")}],
  read:[
   {id:"er1",t:"What is SAML?",s:"Cloudflare",u:"https://www.cloudflare.com/learning/access-management/what-is-saml/"},
   {id:"er2",t:"The difference between OAuth, OpenID Connect and SAML",s:"Okta",u:"https://www.okta.com/identity-101/whats-the-difference-between-oauth-openid-connect-and-saml/"},
   {id:"er3",t:"OWASP Top 10",s:"OWASP",u:"https://owasp.org/Top10/2025/"},
   {id:"er4",t:"OWASP Top 10 for LLM Applications",s:"OWASP",u:"https://owasp.org/projects/top-10-for-large-language-model-applications"}],
  points:[
   "SSO lets employees log in once through the company's identity provider (Okta, Entra ID). SAML is the older XML standard; OIDC is the modern one built on OAuth 2.0.",
   "Authentication is who you are; authorisation is what you're allowed to do. OAuth 2.0 is for authorisation; OIDC adds authentication.",
   "RBAC: give access by role, with least privilege. Nobody gets admin 'just in case'.",
   "Protect data in transit (TLS) and at rest (encryption). Mask or redact PII before it reaches logs or an LLM.",
   "Audit logs record who did what and when. Security teams will ask for them.",
   "Expect questionnaires about SOC 2, data residency (where data is stored) and retention. Answer precisely or say you'll confirm."],
  cards:[
   {id:"e1",q:"Authentication vs authorisation?",a:"Authentication: proving who you are.\nAuthorisation: what you're allowed to do once identified."},
   {id:"e2",q:"SAML vs OIDC?",a:"Both enable SSO. SAML: older, XML-based, common in enterprises.\nOIDC: modern, JSON/JWT-based, built on OAuth 2.0."},
   {id:"e3",q:"What is least privilege?",a:"Give each user or service only the access it needs for its job, nothing more."},
   {id:"e4",q:"A customer asks where their data is stored. What are they really asking?",a:"Data residency and compliance: which country or region, who can access it, and how long it's kept."},
   {id:"e5",q:"How do you keep PII out of an LLM workflow?",a:"Redact or mask it before sending, limit retrieval by user permissions, and log what was sent for audit."}],
  checks:[
   {id:"ec1",t:"I can explain SSO, SAML and OIDC to a customer's IT team"},
   {id:"ec2",t:"I can design role-based access for a simple internal tool"},
   {id:"ec3",t:"I can name five security questions an enterprise will ask and how I'd answer"}]},
 {id:"observe", code:"", title:"Debugging and observability",
  lead:"Things break in environments you don't control. FDEs who can find out why, calmly and fast, become the customer's favourite person.",
  watch:[
   {id:"ov1",t:"Observability Crash Course: Logs, Metrics, Traces Explained",u:YT("umm-MyCl3Q4")},
   {id:"ov2",t:"What are the Three Pillars of Observability?",u:YT("q-T_NmS2Q_w")},
   {id:"ov3",t:"Blameless Postmortems: Create Psychological Safety",u:YT("sgsN6HCkfOo")}],
  read:[
   {id:"or1",t:"Monitoring Distributed Systems",s:"Google SRE Book",u:"https://sre.google/sre-book/monitoring-distributed-systems/"},
   {id:"or2",t:"Postmortem Culture: Learning from Failure",s:"Google SRE Book",u:"https://sre.google/sre-book/postmortem-culture/"},
   {id:"or3",t:"Debugging and Profiling",s:"MIT Missing Semester",u:"https://missing.csail.mit.edu/2020/debugging-profiling/"}],
  points:[
   "Logs tell you what happened, metrics tell you how much and how often, traces show one request's path across services.",
   "Debug systematically: reproduce, isolate (what changed?), form one hypothesis, test it, fix, then add a check so it can't silently return.",
   "Watch the four golden signals: latency, traffic, errors and saturation.",
   "During an incident: stop the bleeding first (roll back, disable the feature), then find the root cause.",
   "Blameless postmortems: timeline, impact, root cause, what went well, and action items with owners. Focus on systems, not people.",
   "Tell the customer early: what's affected, what you're doing, when the next update comes."],
  cards:[
   {id:"o1",q:"Logs vs metrics vs traces?",a:"Logs: detailed records of events.\nMetrics: numbers over time (error rate, latency).\nTraces: one request's journey across services."},
   {id:"o2",q:"Name the four golden signals.",a:"Latency, traffic, errors, saturation."},
   {id:"o3",q:"Production is down after your deploy. First move?",a:"Mitigate: roll back or turn off the change. Investigate the root cause after users are unblocked."},
   {id:"o4",q:"What goes in a blameless postmortem?",a:"Timeline, impact, root cause, what helped, and action items with owners and dates. No blame on individuals."},
   {id:"o5",q:"A bug only happens at the customer site. How do you start?",a:"Get logs and exact reproduction steps, compare their environment and data to yours, and narrow down what's different."}],
  checks:[
   {id:"oc1",t:"I can explain logs, metrics and traces with an example"},
   {id:"oc2",t:"I can walk through how I'd debug a failing integration step by step"},
   {id:"oc3",t:"I can write a one-page postmortem for a past incident I handled"}]},
 {id:"git", code:"", title:"Git and the command line",
  lead:"You'll often be debugging on a customer's server or in their repo. Comfort with git and a terminal is assumed, never taught.",
  watch:[
   {id:"gv1",t:"Git Feature Branch Workflow: A Beginner's Guide for Teams",u:YT("ZBexzpgj1GE")},
   {id:"gv2",t:"Using Pull Requests in your Git Workflow",u:YT("rDcswW9NOnc")},
   {id:"gv3",t:"Linux Command-Line for Beginners: Your First 5 Minutes",u:YT("id3DGvljhT4")},
   {id:"gv4",t:"Linux Terminal Crash Course for Absolute Beginners",u:YT("hREnP0HslK8")}],
  read:[
   {id:"gr1",t:"Git workflows",s:"GitHub Docs",u:"https://docs.github.com/en/get-started/git-basics/git-workflows"},
   {id:"gr2",t:"Introduction to the Shell",s:"MIT Missing Semester",u:"https://missing.csail.mit.edu/2026/course-shell/"},
   {id:"gr3",t:"Patterns for Managing Source Code Branches",s:"Martin Fowler",u:"https://martinfowler.com/articles/branching-patterns.html"}],
  points:[
   "Daily git: branch, commit small logical changes, push, open a pull request, get review, merge. Pull often to stay current.",
   "Know how to undo: git revert (safe, new commit) vs git reset (rewrites history; avoid on shared branches).",
   "Write commit messages that say why, not just what.",
   "Shell basics: cd, ls, cat, less, grep, find, tail -f for live logs, and pipes ( | ) to chain them.",
   "curl to call an API by hand, jq to read JSON, env to check environment variables.",
   "SSH into a server, check what's running (ps, top), disk (df -h) and logs before guessing."],
  cards:[
   {id:"g1",q:"git revert vs git reset?",a:"revert: makes a new commit that undoes a change; safe on shared branches.\nreset: moves the branch pointer and rewrites history; keep it to local work."},
   {id:"g2",q:"How do you follow a log file live?",a:"tail -f path/to/logfile (add | grep ERROR to filter)."},
   {id:"g3",q:"Quickest way to test an API from a terminal?",a:"curl with the URL, headers and body, piped into jq to read the JSON."},
   {id:"g4",q:"What makes a good pull request?",a:"Small and focused, a clear title, why the change is needed, how it was tested, and screenshots or examples where useful."},
   {id:"g5",q:"Find every file mentioning 'api_key' in a project?",a:"grep -rn \"api_key\" . (then make sure none are real secrets committed to git)."}],
  checks:[
   {id:"gc1",t:"I can branch, commit, push and open a pull request without looking it up"},
   {id:"gc2",t:"I can grep logs and follow them live in a terminal"},
   {id:"gc3",t:"I can call an API with curl and read the result with jq"}]},
 {id:"product", code:"", title:"Product sense and communication",
  lead:"Great FDEs decide what not to build, explain trade-offs to executives in two sentences, and turn field lessons into product changes.",
  watch:[
   {id:"mv1",t:"RICE Prioritization Framework Explained for Beginners",u:YT("RoWof5reKO0")},
   {id:"mv2",t:"How to Prioritize Features in Your MVP",u:YT("N-bjex8i1dY")},
   {id:"mv3",t:"Making sense of MVP (Minimum Viable Product)",u:YT("0P7nCmln7PM")}],
  read:[
   {id:"mr1",t:"RICE: simple prioritization for product managers",s:"Intercom",u:"https://www.intercom.com/blog/rice-simple-prioritization-for-product-managers"},
   {id:"mr2",t:"WTF is a forward deployed engineer?",s:"PostHog",u:"https://posthog.com/blog/forward-deployed-engineer"}],
  points:[
   "RICE scores ideas by Reach × Impact × Confidence ÷ Effort. Use it to say no with a reason.",
   "An MVP tests the riskiest assumption with the least work. It's a learning tool, not a smaller version of everything.",
   "Executive updates: lead with the outcome and the number, then risks and what you need from them. Five lines, not five pages.",
   "Demos: show the customer's own data solving their own problem. Rehearse the failure path.",
   "Write a one-page spec before building anything big: problem, users, success metric, scope, out of scope.",
   "Field feedback to product: the pattern (how many customers), the cost of the gap, and a proposed fix."],
  cards:[
   {id:"m1",q:"What does RICE stand for?",a:"Reach, Impact, Confidence, Effort. Score = Reach × Impact × Confidence ÷ Effort."},
   {id:"m2",q:"What is an MVP really for?",a:"Testing your riskiest assumption with the least effort, to learn fast. It's not a smaller version of everything."},
   {id:"m3",q:"How do you structure a two-minute update for a VP?",a:"Outcome and number first, then status vs plan, risks, and the one decision or help you need."},
   {id:"m4",q:"What goes in a one-page spec?",a:"Problem, users, success metric, scope, out of scope, risks and open questions."},
   {id:"m5",q:"How do you turn customer requests into product feedback?",a:"Show the pattern (how many customers), the cost of the gap, examples, and a proposed fix."}],
  checks:[
   {id:"mc1",t:"I can score three feature ideas with RICE and defend the ranking"},
   {id:"mc2",t:"I can give a five-line executive update on a project"},
   {id:"mc3",t:"I can write a one-page spec for a customer build"}]},
 {id:"ai", code:"FDE-04", title:"AI and LLM deployment",
  lead:"Most FDE openings deploy LLMs into customer workflows, so expect at least one round on building and evaluating an AI application.",
  watch:[
   {id:"av1",t:"What is Retrieval Augmented Generation?",u:YT("9_IKLDGzB5Q")},
   {id:"av2",t:"Introduction to LLM Evaluations",u:YT("cNF_MO82Qew")},
   {id:"av3",t:"LLM01: Prompt Injection Explained (OWASP Top 10 for LLMs)",u:YT("LB9v4Nf25-o")}],
  read:[
   {id:"ar1",t:"Building effective AI agents",s:"Anthropic Engineering",u:"https://www.anthropic.com/engineering/building-effective-agents"},
   {id:"ar2",t:"Demystifying evals for AI agents",s:"Anthropic Engineering",u:"https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents"},
   {id:"ar3",t:"Writing effective tools for AI agents",s:"Anthropic Engineering",u:"https://www.anthropic.com/engineering/writing-tools-for-agents"},
   {id:"ar4",t:"The IBM RAG Cookbook",s:"IBM",u:"https://www.ibm.com/think/architectures/rag-cookbook"}],
  points:[
   "Prompting: clear instructions, examples, structured JSON output, system vs user prompts.",
   "RAG: chunk, embed, store in a vector DB, retrieve top-k, ground the answer, cite sources.",
   "Tools and agents: the model calls functions like search or CRM lookup; you validate inputs and cap the number of steps.",
   "Evals: a test set of real inputs with expected outputs, measured before and after every change.",
   "Production concerns: hallucination control, cost and latency, prompt injection from documents, PII redaction, access control on retrieved data.",
   "Fine-tuning is usually the last resort. Try better prompts, retrieval and examples first.",
   "Closing line: ship the narrow version in two weeks, measure it against the eval set, expand from evidence."],
  cards:[
   {id:"a1",q:"Explain the RAG pipeline in one breath.",a:"Split documents into chunks, embed them, store in a vector DB; at query time embed the question, retrieve the top-k chunks, and have the model answer grounded in them with citations."},
   {id:"a2",q:"How do you know an LLM feature is good enough to launch?",a:"Build an eval set from 50–100 real past cases with expected outputs. Measure accuracy before and after every change, and set a launch threshold with the customer."},
   {id:"a3",q:"What is prompt injection and how do you defend against it?",a:"Instructions hidden in user input or retrieved documents that try to hijack the model. Defend by treating retrieved text as data, limiting tool permissions, validating tool inputs and keeping humans in the loop for risky actions."},
   {id:"a4",q:"When would you fine-tune instead of using RAG or prompting?",a:"Rarely and last: when you need a consistent style or format at scale, and prompting plus retrieval plus examples have plateaued on your evals."},
   {id:"a5",q:"Three ways to cut LLM cost or latency?",a:"Cache repeated prompts or results, use a smaller model for simple steps, trim context and stream responses."},
   {id:"a6",q:"Steps to design an AI assistant for a customer?",a:"1. Job to be done and success metric\n2. Data sources and who can see what\n3. Simplest version: prompt + retrieval\n4. Eval set from real cases\n5. Add tools only where evals show they help\n6. Human in the loop where errors are costly"}],
  checks:[
   {id:"ac1",t:"I can explain RAG end to end in under 60 seconds"},
   {id:"ac2",t:"I can explain how I'd build an eval set before launching an LLM feature"},
   {id:"ac3",t:"I can name three production risks of an LLM app and how I'd handle each"}]},
 {id:"customer", code:"FDE-05", title:"Customer skills",
  lead:"The decomposition round is where FDE candidates win or lose. Use the same six steps every time so nerves don't scramble you.",
  watch:[
   {id:"cv1",t:"Consulting Case Interview: How to Structure Any Problem in 60 Seconds",u:YT("qMuLpukgbfk")},
   {id:"cv2",t:"How to use Issue Tree for problem solving",u:YT("i5Jr_MfTDgA")},
   {id:"cv3",t:"Case Interview Frameworks: 4 Starter Frameworks to Know",u:YT("5IVWUYZj6mI")}],
  read:[
   {id:"cr1",t:"Who Wants to be a Delta?",s:"Palantir blog",u:"https://blog.palantir.com/who-wants-to-be-a-delta-8d2ea948035"}],
  points:[
   "1. Restate and clarify: who is the user, what does success look like as a number, what has been tried.",
   "2. Find the real problem: ask why until you hit something measurable and fixable.",
   "3. Map the current state: people, systems, data, and where the process breaks.",
   "4. Propose the smallest useful build: one workflow, one team, shippable in 2–4 weeks.",
   "5. Name risks and unknowns: data access, data quality, change management, security review.",
   "6. Define the path to scale: what you measure, who signs off, what comes next.",
   "Your admin and training background is a real edge: you already translate between business users and technical teams. Say it out loud."],
  cards:[
   {id:"c1",q:"Recite the six decomposition steps.",a:"1. Restate and clarify\n2. Find the real problem\n3. Map the current state\n4. Smallest useful build\n5. Risks and unknowns\n6. Path to scale"},
   {id:"c2",q:"The customer keeps adding scope. What's your move?",a:"Acknowledge it, log it, tie it to phase 2, and protect the current deadline."},
   {id:"c3",q:"Two stakeholders want opposite things. What do you do?",a:"Bring both onto one call and anchor the decision on the shared success metric."},
   {id:"c4",q:"You have to deliver bad news (a delay or a bug). How?",a:"Tell them first, before they find out. Give cause, impact and the fix plan."},
   {id:"c5",q:"Give two discovery questions you always ask.",a:"\"Walk me through the last time this went wrong.\"\n\"If we solved only one part of this, which part matters most?\""}],
  checks:[
   {id:"cc1",t:"Ran the six steps on: a distributor's sales reps can't find product specs fast"},
   {id:"cc2",t:"Ran the six steps on: a university wants better student-internship matching"},
   {id:"cc3",t:"Ran the six steps on: a bank's support team is drowning in repetitive email"}]},
 {id:"stories", code:"FDE-06", title:"STAR stories",
  lead:"Prepare five stories from your own work and reuse them across questions. Each should land in under two minutes, with real numbers in the result.",
  watch:[
   {id:"sv1",t:"How to Answer Behavioral Interview Questions Using the STAR Method",u:YT("WSbN-0swDgM")},
   {id:"sv2",t:"STAR Method Interview Questions & Answers",u:YT("sduvSv-yFFQ")}],
  read:[],
  points:[
   "Data integration under real constraints: the Cin7-to-Salesforce data integrity demo.",
   "Modernising legacy systems: Flow migration from legacy automation, released through COPADO.",
   "Shipping under a tight deadline: the PUP MongoDB assessment for the summer cohort.",
   "Owning a customer-facing program: the Google Generative AI Accelerator across universities.",
   "Recommending a technical decision: the Mac MDM platform evaluation.",
   "Positioning line: you've made enterprise systems work for the people using them; FDE is the same job with more code and more ownership."],
  cards:[
   {id:"s1",q:"\"Tell me about working with ambiguous requirements.\" Which story?",a:"The MDM evaluation or the Generative AI Accelerator rollout."},
   {id:"s2",q:"\"A time a customer was under pressure.\" Which story?",a:"The PUP MongoDB assessment: requirement surfaced days before the deadline."},
   {id:"s3",q:"\"Your most complex technical project.\" Which story?",a:"Flow migration from legacy automation, or the Cin7-to-Salesforce integration."},
   {id:"s4",q:"\"A time you influenced without authority.\" Which story?",a:"The MDM recommendation: you evaluated vendors and won the decision with a written case."},
   {id:"s5",q:"What does STAR stand for, and where do most people go weak?",a:"Situation, Task, Action, Result. Most people skip the Result or give it without a number."}],
  checks:[
   {id:"sc1",t:"Cin7 integration story told aloud in under 2 minutes, with a number in the result"},
   {id:"sc2",t:"Flow migration story told aloud, with a number in the result"},
   {id:"sc3",t:"PUP assessment story told aloud, with a number in the result"},
   {id:"sc4",t:"Accelerator program story told aloud, with a number in the result"},
   {id:"sc5",t:"MDM evaluation story told aloud, with a number in the result"}]},
 {id:"drills", code:"FDE-07", title:"Practice drills",
  lead:"Work these out loud with a timer. Sign one off only after you've done it end to end.",
  watch:[
   {id:"dv1",t:"SQL Window Functions: The Key to Succeeding in Data Science Interviews",u:YT("e-EL-6Vnkbg")},
   {id:"dv2",t:"Message Queues in System Design Interviews",u:YT("1ISRd0bS714")}],
  read:[],
  points:[
   "Coding, 30 minutes each: revenue per customer from a messy orders CSV; a paginated API loop with 429 retries; merging contacts where emails differ in case and whitespace.",
   "SQL, 15 minutes each: latest order per customer; customers who bought in January but not February; month-over-month revenue change with LAG().",
   "System design, 45 minutes each: near-real-time inventory-to-CRM order sync; a RAG assistant over 10,000 policy PDFs with department-level access; a nightly data-quality pipeline across three systems.",
   "Partner tip: swap roles. One of you plays the customer and keeps adding scope; the other runs the decomposition."],
  cards:[
   {id:"d1",q:"Messy CSV: what's your plan before writing code?",a:"Validate each row, skip and log bad ones, normalise fields, dedupe on the order ID, then group and sum. Say this plan out loud first."},
   {id:"d2",q:"Customers who bought in January but not February: approach?",a:"Select January buyers, then LEFT JOIN February buyers and keep rows where the February side is NULL, or use NOT EXISTS."},
   {id:"d3",q:"RAG over policy PDFs with department access: the key design risk?",a:"Leaking documents across departments. Filter retrieval by the user's permissions before anything reaches the model, and log what was retrieved."}],
  checks:[
   {id:"dc1",t:"Coding drill: messy orders CSV, solved in 30 minutes"},
   {id:"dc2",t:"Coding drill: paginated API with retries, solved in 30 minutes"},
   {id:"dc3",t:"SQL drill set: all three queries written and checked"},
   {id:"dc4",t:"System design: RAG assistant with access control, presented to my partner"},
   {id:"dc5",t:"Mock decomposition with my partner playing the customer"}]},
