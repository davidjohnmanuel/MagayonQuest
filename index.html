const NEW_MODS = {
 ts: {id:"ts", code:"", title:"JavaScript and TypeScript",
  lead:"Most FDE job posts ask for Python and/or TypeScript. TypeScript is how you'll build customer-facing tools, integrations and agent servers.",
  watch:[
   {id:"iv1",t:"TypeScript in 100 Seconds",u:YT("zQnBQ4tB3ZA")},
   {id:"iv2",t:"Array Map in 100 Seconds",u:YT("DC471a9qrU4")},
   {id:"iv3",t:"Array Reduce in 100 Seconds",u:YT("tVCYa_bnITg")}],
  read:[
   {id:"ir1",t:"TypeScript for JavaScript Programmers",s:"TypeScript Docs",u:"https://www.typescriptlang.org/docs/handbook/typescript-in-5-minutes.html"},
   {id:"ir2",t:"The Basics",s:"TypeScript Handbook",u:"https://www.typescriptlang.org/docs/handbook/2/basic-types.html"}],
  points:[
   "TypeScript is JavaScript with types. The compiler catches mistakes like a misspelled field or a missing argument before your code runs.",
   "Everyday JavaScript: const and let, arrow functions, objects and arrays, destructuring, template strings, map/filter/reduce.",
   "async/await for anything that waits: API calls, database queries. Always handle errors with try/catch.",
   "Types to know: string, number, boolean, arrays, union types (\"open\" | \"closed\"), interfaces for object shapes, optional fields with ?.",
   "Node.js runs JavaScript on servers; npm installs packages; package.json lists them.",
   "Your Apex and Salesforce Flow background maps well: strong typing, triggers, and async callouts work the same way here."],
  cards:[
   {id:"i1",q:"Why use TypeScript over plain JavaScript?",a:"Types catch errors at build time (wrong fields, missing args), make code self-documenting and give better autocomplete."},
   {id:"i2",q:"map vs filter vs reduce?",a:"map: transform each item.\nfilter: keep items that pass a test.\nreduce: combine all items into one value (e.g. a total)."},
   {id:"i3",q:"What does async/await do?",a:"Lets you write code that waits for promises (API calls, DB queries) in a readable top-to-bottom way. Wrap it in try/catch."},
   {id:"i4",q:"What is a union type?",a:"A value that can be one of several types, e.g. status: \"open\" | \"closed\". The compiler blocks anything else."},
   {id:"i5",q:"const vs let?",a:"const: can't be reassigned. let: can be reassigned. Default to const."}],
  checks:[
   {id:"ic1",t:"I can write an async TypeScript function that calls an API and handles errors"},
   {id:"ic2",t:"I can define an interface for a customer record and use it"},
   {id:"ic3",t:"I can use map, filter and reduce on an array of orders"}]},
 sqldb: {id:"sqldb", code:"", title:"Databases and data design",
  lead:"Every integration lands somewhere. Knowing how databases store, index and protect data stops slow queries and corrupted records.",
  watch:[
   {id:"xv1",t:"PostgreSQL Indexes Explained",u:YT("Q4zh9J6HN6o")},
   {id:"xv2",t:"A Deep Dive Into PostgreSQL Indexes",u:YT("pfbohxaZOSI")}],
  read:[
   {id:"xr1",t:"Indexes: Introduction",s:"PostgreSQL Docs",u:"https://www.postgresql.org/docs/current/indexes-intro.html"},
   {id:"xr2",t:"Chapter 11. Indexes",s:"PostgreSQL Docs",u:"https://www.postgresql.org/docs/current/indexes.html"}],
  points:[
   "Relational databases (Postgres, MySQL) store tables with rows and enforce structure; document stores (MongoDB) store flexible JSON.",
   "Primary keys identify rows; foreign keys link tables and protect relationships.",
   "Indexes make lookups fast on the columns you filter or join by, at the cost of slower writes and more storage.",
   "Transactions group changes so they all succeed or all fail (ACID). Use them when moving money or syncing linked records.",
   "Normalise to avoid duplicated data; denormalise on purpose for read-heavy reporting.",
   "Read a query plan (EXPLAIN) before guessing why a query is slow."],
  cards:[
   {id:"x1",q:"What does an index do, and what does it cost?",a:"Speeds up lookups and joins on those columns. Costs: slower inserts/updates and extra storage."},
   {id:"x2",q:"Primary key vs foreign key?",a:"Primary key: uniquely identifies a row.\nForeign key: points to another table's primary key to link records."},
   {id:"x3",q:"When do you need a transaction?",a:"When several changes must all succeed or all fail together, e.g. creating an order and its line items."},
   {id:"x4",q:"SQL vs NoSQL in one line each?",a:"SQL: structured tables, joins, strong consistency.\nNoSQL: flexible documents or key-values, easy to scale, fewer joins."},
   {id:"x5",q:"A query is slow. First step?",a:"Run EXPLAIN to see the plan; look for full table scans and add an index on the filtered or joined columns."}],
  checks:[
   {id:"xc1",t:"I can design tables with keys for customers, orders and line items"},
   {id:"xc2",t:"I can explain when to add an index and read a basic EXPLAIN"},
   {id:"xc3",t:"I can explain transactions with a real example"}]},
 apis: {id:"apis", code:"", title:"Building APIs and backends",
  lead:"FDEs don't just call APIs, they build them: small services that glue a customer's systems to your product.",
  watch:[
   {id:"hv1",t:"9 Must-Know REST API Design Principles for Developers",u:YT("pJ83mmqcvoQ")},
   {id:"hv2",t:"Good APIs Vs Bad APIs: 7 Tips for API Design",u:YT("_gQaygjm_hg")}],
  read:[
   {id:"hr1",t:"FastAPI: First Steps",s:"FastAPI Docs",u:"https://fastapi.tiangolo.com/tutorial/first-steps/"},
   {id:"hr2",t:"FastAPI: Request Body",s:"FastAPI Docs",u:"https://fastapi.tiangolo.com/tutorial/body/"}],
  points:[
   "Design resources as nouns (/customers/42/orders) and use HTTP verbs for actions (GET, POST, PATCH, DELETE).",
   "Validate every input at the edge and return clear errors with the right status code.",
   "Paginate list endpoints with a cursor; version your API (/v1) so you can change it without breaking customers.",
   "Receiving webhooks: verify the signature, respond 200 fast, process in the background, and handle duplicates.",
   "Make writes idempotent with an idempotency key so retries don't double-charge or double-create.",
   "FastAPI (Python) and Express or Hono (TypeScript) are quick ways to stand up a service."],
  cards:[
   {id:"h1",q:"How do you name REST endpoints?",a:"Nouns for resources, verbs from HTTP: GET /customers, POST /customers, PATCH /customers/42."},
   {id:"h2",q:"How should you handle an incoming webhook?",a:"Verify the signature, return 200 quickly, queue the work, and skip events you've already processed."},
   {id:"h3",q:"What is an idempotency key?",a:"A unique key sent with a write request so the server can recognise a retry and not create a duplicate."},
   {id:"h4",q:"Why version an API?",a:"So you can make breaking changes in /v2 while existing customers keep working on /v1."},
   {id:"h5",q:"PUT vs PATCH?",a:"PUT replaces the whole resource. PATCH updates only the fields you send."}],
  checks:[
   {id:"hc1",t:"I can build a small API with two endpoints in FastAPI or Express"},
   {id:"hc2",t:"I can receive and verify a webhook safely"},
   {id:"hc3",t:"I can explain pagination, versioning and idempotency"}]},
 agents: {id:"agents", code:"", title:"AI agents and tool use",
  lead:"Job posts increasingly ask for agent orchestration. Agents are LLMs that call tools in a loop to finish real tasks, and FDEs wire them into customer systems.",
  watch:[
   {id:"nv1",t:"MCP Explained in 7 Minutes (Model Context Protocol)",u:YT("84B0dPlcvE0")},
   {id:"nv2",t:"How Model Context Protocol (MCP) actually works",u:YT("cGuyrANVi4A")},
   {id:"nv3",t:"What is MCP? Why AI Agents Need It",u:YT("Vuixmnhc1v4")}],
  read:[
   {id:"nr1",t:"Tool use with Claude",s:"Claude Docs",u:"https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"},
   {id:"nr2",t:"What is the Model Context Protocol (MCP)?",s:"MCP Docs",u:"https://modelcontextprotocol.io/docs/2026-07-28/getting-started/intro"},
   {id:"nr3",t:"Understanding MCP servers",s:"MCP Docs",u:"https://modelcontextprotocol.io/docs/2026-07-28/learn/server-concepts"},
   {id:"nr4",t:"How we built our multi-agent research system",s:"Anthropic Engineering",u:"https://www.anthropic.com/engineering/multi-agent-research-system"}],
  points:[
   "Tool use: you describe functions (name, description, input schema); the model decides when to call them; your code runs them and returns the result.",
   "An agent is that loop repeated: think, call a tool, read the result, decide the next step, until done or a step limit.",
   "MCP (Model Context Protocol) is a standard way to expose tools and data to AI apps, so one connector works across many clients.",
   "Start with a workflow (fixed steps) before a free-roaming agent. Add autonomy only where evals show it helps.",
   "Guardrails: validate tool inputs, limit permissions, cap steps and cost, and require human approval for risky actions.",

  cards:[

   {id:"n2",q:"What is MCP?",a:"Model Context Protocol: an open standard for connecting AI apps to tools and data through MCP servers, so integrations are reusable."},
   {id:"n3",q:"Workflow vs agent?",a:"Workflow: you control the steps.\nAgent: the model chooses the steps. Start with workflows; add agency where it pays off."},
   {id:"n4",q:"Three guardrails for an agent touching a CRM?",a:"Least-privilege credentials, input validation on every tool, and human approval before writes or sends."},
   {id:"n5",q:"Why cap an agent's steps?",a:"To stop runaway loops and cost, and to fail safely with a clear message instead of hanging."}],

  points:[

   {id:"u4",q:"How do you make an LLM judge trustworthy?",a:"A specific rubric, pass/fail rather than 1–10 scores, and measure its agreement with human-labelled examples."},

const okId=k=>typeof k==="string"&&k.length<24&&/^[a-z0-9]+$/.test(k);
function normalize(raw){
  const d=blank(); if(!raw||typeof raw!=="object")return d;

  if(raw.res&&typeof raw.res==="object")for(const k in raw.res)if(raw.res[k]===true&&okId(k))d.res[k]=true;
  if(raw.cards&&typeof raw.cards==="object")for(const k in raw.cards)if((raw.cards[k]==="got"||raw.cards[k]==="again")&&okId(k))d.cards[k]=raw.cards[k];
  if(Array.isArray(raw.log))d.log=[...new Set(raw.log.filter(x=>typeof x==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(x)))].sort().slice(-180);
  if(raw.time&&typeof raw.time==="object"){
    const days=Object.keys(raw.time).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort().slice(-120);
    for(const day of days){const t=raw.time[day];if(!t||typeof t!=="object")continue;const o={};for(const k in t){const v=Math.round(Number(t[k]));if(MOD[k]&&v>0&&v<=1440)o[k]=v;}if(Object.keys(o).length)d.time[day]=o;}
  }
  if(Array.isArray(raw.chat))d.chat=raw.chat.filter(m=>m&&typeof m.id==="string"&&/^[a-z0-9]{4,24}$/.test(m.id)&&typeof m.t==="string"&&!isNaN(Date.parse(m.t))&&typeof m.x==="string"&&m.x.trim()).map(m=>{const o={id:m.id,t:m.t.slice(0,40),x:m.x.slice(0,300),k:m.k==="e"?"e":m.k==="q"&&typeof m.q==="string"&&/^q[a-z0-9]{4,20}$/.test(m.q)?"q":m.k==="b"&&typeof m.q==="string"&&/^b[a-z0-9]{4,20}$/.test(m.q)?"b":"m"};if(o.k==="q"||o.k==="b")o.q=m.q;return o;}).slice(-120);
  if(Array.isArray(raw.quizzes))d.quizzes=raw.quizzes.filter(z=>z&&typeof z.id==="string"&&/^q[a-z0-9]{4,20}$/.test(z.id)&&Array.isArray(z.m)&&typeof z.t==="string").map(z=>({id:z.id,m:z.m.filter(id=>MOD[id]).slice(0,8),src:z.src==="ai"?"ai":"bank",t:z.t.slice(0,40),qs:cleanQs(z.qs)})).filter(z=>z.m.length&&z.qs.length).slice(-8);
  if(raw.qa&&typeof raw.qa==="object"){const keys=Object.keys(raw.qa).filter(k=>/^q[a-z0-9]{4,20}$/.test(k)).slice(-40);for(const k of keys){const r=raw.qa[k];if(r&&Array.isArray(r.ans))d.qa[k]={ans:r.ans.filter(v=>Number.isInteger(v)&&v>=-1&&v<4).slice(0,10),t:typeof r.t==="string"?r.t.slice(0,40):""};}}
  if(typeof raw.hero==="string"&&HERO[raw.hero])d.hero=raw.hero;
  if(raw.heroXp&&typeof raw.heroXp==="object")for(const k in raw.heroXp){const v=Math.round(Number(raw.heroXp[k]));if(HERO[k]&&v>=0&&v<1e7)d.heroXp[k]=v;}
  if(Array.isArray(raw.battles))d.battles=raw.battles.filter(z=>z&&typeof z.id==="string"&&/^b[a-z0-9]{4,20}$/.test(z.id)&&Array.isArray(z.m)&&typeof z.t==="string").map(z=>({id:z.id,m:z.m.filter(id=>MOD[id]).slice(0,8),src:z.src==="ai"?"ai":"bank",t:z.t.slice(0,40),qs:cleanQs(z.qs,20)})).filter(z=>z.m.length&&z.qs.length>=3).slice(-6);
  if(raw.bt&&typeof raw.bt==="object"){const keys=Object.keys(raw.bt).filter(k=>/^b[a-z0-9]{4,20}$/.test(k)).slice(-20);for(const k of keys){const r=raw.bt[k];if(!r||!HERO[r.h]||!Array.isArray(r.ans))continue;d.bt[k]={h:r.h,tl:Math.min(6,Math.max(1,Math.round(Number(r.tl))||1)),ans:r.ans.filter(a=>a&&Number.isInteger(a.k)&&a.k>=-1&&a.k<4).slice(0,20).map(a=>({k:a.k,ms:Math.min(60000,Math.max(0,Math.round(Number(a.ms))||0)),s:typeof a.s==="string"&&SKILLS[a.s]?a.s:"",it:typeof a.it==="string"&&ITEMS[a.it]?a.it:""}))};}}
  if(Array.isArray(raw.buys))d.buys=raw.buys.filter(x=>x&&typeof x.i==="string"&&/^(item:(potion|hourglass|scroll|flask)|sk:[a-z]{2,12}:[1-6]|hero:[a-z]{2,12}|title:[a-z]{2,12})$/.test(x.i)&&Number.isInteger(x.p)&&x.p>=0&&x.p<=5000).map(x=>({i:x.i,p:x.p,t:typeof x.t==="string"?x.t.slice(0,40):""})).slice(-400);
  if(typeof raw.title==="string"&&/^[a-z]{2,12}$/.test(raw.title))d.title=raw.title;
  if(Array.isArray(raw.apps))d.apps=raw.apps.filter(a=>a&&typeof a.id==="string"&&/^j[a-z0-9]{3,20}$/.test(a.id)&&typeof a.co==="string"&&a.co.trim()).map(a=>({id:a.id,co:a.co.slice(0,60),ro:typeof a.ro==="string"?a.ro.slice(0,60):"",st:[...STAGES,"Rejected"].includes(a.st)?a.st:"Applied",hi:Math.min(5,Math.max(0,Math.round(Number(a.hi))||0)),t:typeof a.t==="string"?a.t.slice(0,40):""})).slice(-120);

  if(raw.cert&&typeof raw.cert==="object"&&typeof raw.cert.t==="string"&&Number.isInteger(raw.cert.sc)&&Number.isInteger(raw.cert.n)&&raw.cert.n>0&&raw.cert.sc/raw.cert.n>=EXAM_PASS&&typeof raw.cert.id==="string")d.cert={t:raw.cert.t.slice(0,40),sc:raw.cert.sc,n:raw.cert.n,id:raw.cert.id.slice(0,24)};

  if(GOALS.includes(raw.goal))d.goal=raw.goal;
  if(typeof raw.updated==="string")d.updated=raw.updated.slice(0,40);
  return d;
}
const minsOn=(d,day)=>Object.values(d.time[day]||{}).reduce((s,v)=>s+v,0);
const totalMins=d=>Object.keys(d.time).reduce((s,day)=>s+minsOn(d,day),0);
const weekByTopic=d=>{const o={};daysBack(7).forEach(day=>{const t=d.time[day]||{};for(const k in t)o[k]=(o[k]||0)+t[k];});return o;};
const weekMins=d=>Object.values(weekByTopic(d)).reduce((s,v)=>s+v,0);
const bonusDays=d=>Object.keys(d.time).filter(day=>minsOn(d,day)>=d.goal&&Object.keys(d.time[day]).length>=2).length;
function xpOf(d,owner){return appsXP(d)+(d.cert?200:0)+battleXPFor(d,owner)+Object.keys(d.checks).length*10+Object.values(d.cards).filter(v=>v==="got").length*5+Object.keys(d.res).length*5+d.log.length*15+Math.floor(totalMins(d)/5)+bonusDays(d)*10+quizXP(d);}
function battleXPFor(d,owner){if(typeof players!=="object"||!d.bt||!Object.keys(d.bt).length)return 0;owner=owner||myId||"me";const cands=[{id:myId||"me",d:mine},...Object.keys(players).filter(id=>id!==myId).map(id=>({id,d:normalize(players[id])}))].filter(c=>c.id!==owner);let x=0;const pool={};[d,...cands.map(c=>c.d)].forEach(p=>(p.battles||[]).forEach(z=>{if(!pool[z.id])pool[z.id]=z;}));for(const bid in d.bt){const b=pool[bid];if(!b)continue;const A=d.bt[bid].ans;x+=A.filter((r,i)=>b.qs[i]&&r.k===b.qs[i].a).length*3;const o=cands.find(c=>c.d.bt[bid]);if(o){const st=battleState(b,A,o.d.bt[bid].ans);if(st.winner!==null)x+=st.winner===0?35:10;}}return x;}
function quizXP(d){let x=0;const pool={};d.quizzes.forEach(z=>pool[z.id]=z);if(typeof players==="object")for(const id in players){const p=players[id];if(p&&Array.isArray(p.quizzes))p.quizzes.forEach(z=>{if(z&&z.id&&!pool[z.id]){const qs=cleanQs(z.qs);if(qs.length)pool[z.id]={qs};}});}for(const k in d.qa){const z=pool[k];if(!z)continue;const r=d.qa[k];x+=r.ans.filter((v,i)=>z.qs[i]&&v===z.qs[i].a).length*3;if(r.ans.length>=z.qs.length)x+=5;}return x;}
function levelOf(xp){let i=0;LEVELS.forEach((l,j)=>{if(xp>=l.min)i=j;});const cur=LEVELS[i],nxt=LEVELS[i+1];return{i,name:cur.n,next:nxt?nxt.n:null,pct:nxt?Math.round((xp-cur.min)/(nxt.min-cur.min)*100):100,toNext:nxt?nxt.min-xp:0};}
function streakOf(log){const s=new Set(log);const d=new Date();if(!s.has(dayKey(d))){d.setDate(d.getDate()-1);if(!s.has(dayKey(d)))return 0;}let n=0;while(s.has(dayKey(d))){n++;d.setDate(d.getDate()-1);}return n;}
function maxStreak(log){let best=0,run=0,prev=null;log.forEach(k=>{const t=Date.parse(k+"T00:00:00");run=(prev!==null&&Math.round((t-prev)/864e5)===1)?run+1:1;best=Math.max(best,run);prev=t;});return best;}
function daysSince(log){if(!log.length)return null;const a=new Date(log[log.length-1]+"T00:00:00"),b=new Date(todayKey()+"T00:00:00");return Math.round((b-a)/864e5);}
function statusOf(d){const ds=daysSince(d.log);if(ds===null)return{cls:"warn",t:"New player"};if(ds<=3)return{cls:"good",t:ds===0?"Online today":"On track"};if(ds<=7)return{cls:"warn",t:`AFK ${ds}d`};return{cls:"bad",t:"Overdue"};}
function doneCount(d,m){return m.checks.filter(c=>d.checks[c.id]).length+m.cards.filter(c=>d.cards[c.id]==="got").length+m.watch.filter(r=>d.res[r.id]).length+m.read.filter(r=>d.res[r.id]).length;}
function modPct(d,m){return Math.round(doneCount(d,m)/(m.checks.length+m.cards.length+m.watch.length+m.read.length)*100);}
function pctOf(d){return Math.round(MODULES.reduce((s,m)=>s+doneCount(d,m),0)/ALL_ITEMS*100);}

function change(fn,opt){
  if(mode==="readonly"){toast("View only: ask David to add your email to the study list");return;}
  const xp0=xpOf(mine), before=levelOf(xp0).i, c0=coinsEarned(mine);
  fn(mine); mine.updated=new Date().toISOString();
  try{localStorage.setItem(LS,JSON.stringify(mine));}catch(e){}
  let xp1=xpOf(mine);
  if(xp1>xp0&&mine.hero){mine.heroXp[mine.hero]=(mine.heroXp[mine.hero]||0)+(xp1-xp0);}
  const after=levelOf(xp1);
  try{localStorage.setItem(LS,JSON.stringify(mine));}catch(e){}
  if(!(opt&&opt.quiet))popXP(xp1-xp0);
  {const dc=coinsEarned(mine)-c0;if(dc>0)setTimeout(()=>popCoins(dc),250);}
  if(after.i>before)setTimeout(()=>levelUp(after),500);
  if(mode==="shared"){dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(flush,opt&&opt.now?0:700);}
  render();
}
async function flush(){
  if(writing){again=true;return;}
  writing=true;
  try{await db.doc("progress/"+myId).set(JSON.parse(JSON.stringify(mine)));saveMsg="";}
  catch(e){
    if(e&&e.code==="invalid_argument"){mode="readonly";saveMsg="You can see everything but can't save yet. Ask David to add your email to the study list.";}
    else saveMsg="Couldn't sync just now. Your progress is kept on this phone and syncs on your next change.";
  }
  writing=false;
  if(again){again=false;return flush();}
  dirty=false; renderNote();
}
function addTime(topic,mins){
  mins=Math.round(mins); if(!MOD[topic]||mins<1)return;
  const t=todayKey(), first=!mine.log.includes(t);
  change(d=>{d.time[t]=d.time[t]||{};d.time[t][topic]=Math.min(1440,(d.time[t][topic]||0)+mins);if(!d.log.includes(t)){d.log.push(t);d.log.sort();}});
  const both=mate().some(id=>normalize(players[id]).log.includes(t));
  toast(first&&both?"Co-op bonus: you both showed up today ♡":`Logged ${fmtMin(mins)} on ${MOD[topic].title}`);
}

function suggestion(){
  const w=weekByTopic(mine);
  const ranked=MODULES.filter(m=>modPct(mine,m)<100).sort((a,b)=>(w[a.id]||0)-(w[b.id]||0));
  const m=ranked[0]||MODULES[0];
  const r=[...m.watch.map(x=>({...x,k:"Watch"})),...m.read.map(x=>({...x,k:"Read"}))].find(x=>!mine.res[x.id]);
  return {m,r,mins:w[m.id]||0};
}

  let sk=0; const dd=new Date(); if(!bothSet.has(dayKey(dd)))dd.setDate(dd.getDate()-1); while(bothSet.has(dayKey(dd))){sk++;dd.setDate(dd.getDate()-1);}

async function adminRequest(method="GET", body){
  const { data } = await sb.auth.getSession();
  if (!data.session) throw new Error("Sign in again to manage users.");
  const response = await fetch("/api/admin-users", {
    method,
    headers: { authorization: `Bearer ${data.session.access_token}`, ...(body ? { "content-type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined
  });
  const result = await response.json().catch(() => ({}));
  return { response, result };
}
async function loadAdminUsers(panel){
  const status = panel.querySelector("[data-admin-status]");
  try {
    const { response, result } = await adminRequest();
    if (!panel.isConnected) return;
    if (response.status === 403 || response.status === 503){ panel.hidden = true; return; }
    panel.hidden = false;
    if (!response.ok){ status.textContent = result.error || "Could not load user settings."; return; }
    const list = panel.querySelector("[data-admin-list]");
    status.textContent = `${result.users.length} account${result.users.length === 1 ? "" : "s"}`;
    list.innerHTML = result.users.map(user=>{
      const state = user.isMember ? "Study-list access" : user.hasAccount ? (user.confirmed ? "No study-list access" : "Email not verified") : "Invited · no account yet";
      return `<div class="admin-user"><div class="admin-user-info"><b>${esc(user.email)}</b><span class="hud">${state}</span></div><div class="admin-user-actions">${user.isMember ? `<button class="linkbtn" data-admin-action="remove" data-email="${esc(user.email)}">Remove access</button>` : `<button class="linkbtn" data-admin-action="add" data-email="${esc(user.email)}">Grant access</button>`}${user.hasAccount ? `<button class="linkbtn" data-admin-action="delete" data-email="${esc(user.email)}">Delete account</button>` : ""}</div></div>`;
    }).join("") || `<p class="muted">No users yet.</p>`;
    panel.querySelector("[data-admin-add]").onsubmit = async event=>{
      event.preventDefault();
      const input = panel.querySelector("[name=admin-email]"), button = event.submitter;
      button.disabled = true; status.textContent = "Saving…";
      try {
        const { response: actionResponse, result: actionResult } = await adminRequest("POST", { action: "add", email: input.value.trim() });
        if (!actionResponse.ok) throw new Error(actionResult.error || "Could not grant access.");
        input.value = ""; await loadAdminUsers(panel);
      } catch (error){ status.textContent = error.message; }
      finally { if (button.isConnected) button.disabled = false; }
    };
    list.querySelectorAll("[data-admin-action]").forEach(button=>button.onclick=async()=>{
      const action = button.dataset.adminAction, email = button.dataset.email;
      const prompt = action === "delete" ? `Permanently delete ${email} and their Supabase data?` : action === "remove" ? `Remove study-list access for ${email}?` : `Grant study-list access to ${email}?`;
      if (!window.confirm(prompt)) return;
      button.disabled = true; status.textContent = "Saving…";
      try {
        const { response: actionResponse, result: actionResult } = await adminRequest("POST", { action, email });
        if (!actionResponse.ok) throw new Error(actionResult.error || "Could not update this user.");
        await loadAdminUsers(panel);
      } catch (error){ status.textContent = error.message; }
      finally { if (button.isConnected) button.disabled = false; }
    });
  } catch (error){
    if (!panel.isConnected) return;
    panel.hidden = false; status.textContent = error.message || "Could not load user settings.";
  }
}

const QID = () => "q" + (Date.now().toString(36) + Math.random().toString(36).slice(2, 7)).slice(0, 14);
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function cleanQs(list, max){
  if (!Array.isArray(list)) return [];
  return list.filter(x => x && typeof x.q === "string" && Array.isArray(x.o) && x.o.length === 4 && x.o.every(o => typeof o === "string" && o.trim()) && Number.isInteger(x.a) && x.a >= 0 && x.a < 4)
    .map(x => ({ q: x.q.slice(0, 300), o: x.o.map(o => o.slice(0, 160)), a: x.a, w: typeof x.w === "string" ? x.w.slice(0, 300) : "" })).slice(0, max || 10);
}
function bankQuiz(ids, n){
  const pool = shuffle(ids.flatMap(id => (BANK[id] || []).map(x => ({ ...x, mid: id }))));
  return pool.slice(0, n).map(x => { const order = shuffle([0, 1, 2, 3]); return { q: x.q, o: order.map(k => x.o[k]), a: order.indexOf(0), w: x.w }; });
}
function quizPrompt(ids, n){
  const brief = ids.map(id => { const m = MOD[id]; return `## ${m.title}\n${m.lead}\n${m.points.join("\n")}\nKey Q&A:\n${m.cards.map(c => `- ${c.q} ${c.a.replace(/\n/g, " ")}`).join("\n")}`; }).join("\n\n");
  return `You write practice quizzes for two people preparing for Forward Deployed Engineer (FDE) job interviews.\n\nWrite exactly ${n} multiple-choice questions based on the study material below. Mix recall with short scenario questions ("A customer says X, what do you do?"). Each question has exactly 4 options, one clearly correct; wrong options must be plausible. Keep questions under 200 characters and options under 120 characters. Vary which position holds the correct answer.\n\nReply with only a JSON array, no other text. Each item: {"q": question, "o": [4 option strings], "a": index 0-3 of the correct option, "w": one-sentence explanation}.\nExample item: {"q":"An API returns 429. What should you do?","o":["Back off and retry with delay","Retry instantly in a loop","Delete the record","Ignore it"],"a":0,"w":"429 means rate limited, so back off."}\n\nStudy material:\n${brief.slice(0, 9000)}`;
}
function allQuizzes(){
  const out = {};
  const add = (d, who) => d.quizzes.forEach(z => { if (!out[z.id]) out[z.id] = { ...z, by: who }; });
  add(mine, myId || "me");
  mate().forEach(id => add(normalize(players[id]), id));
  return out;
}
function quizTitle(z){ return z.m.length >= MODULES.length ? "All missions" : z.m.map(id => MOD[id] ? MOD[id].title : id).join(" + "); }
function resultOf(d, z){ const r = d.qa[z.id]; if (!r) return null; const right = r.ans.filter((v, i) => v === z.qs[i].a).length; return { done: r.ans.length >= z.qs.length, right, answered: r.ans.length, n: z.qs.length }; }

async function createQuiz(){
  const ids = quizUI.sel.length ? quizUI.sel : MODULES.map(m => m.id);
  let qs = [], src = quizUI.src;
  if (src === "ai" && aiGen){
    quizUI.busy = true; quizUI.err = ""; renderQuizSheet();
    quizUI.ctl = new AbortController();
    try { qs = cleanQs(await aiGen(quizPrompt(ids, quizUI.n), quizUI.ctl.signal)); if (qs.length < 3) throw { code: "invalid_json" }; }
    catch (e){
      quizUI.busy = false;
      if (e && e.code === "cancelled"){ renderQuizSheet(); return; }
      quizUI.err = e && (e.code === "not_granted" || e.code === "sampling_disabled") ? "AI quizzes aren't allowed in this view. Using the question bank instead." : "Couldn't generate an AI quiz just now. Try again, or use the question bank.";
      if (e && (e.code === "not_granted" || e.code === "sampling_disabled")){ aiGen = null; quizUI.src = "bank"; }
      renderQuizSheet(); return;
    }
    quizUI.busy = false;
  } else { src = "bank"; qs = bankQuiz(ids, quizUI.n); }
  if (!qs.length){ quizUI.err = "No questions found for that pick."; renderQuizSheet(); return; }
  const id = QID(), t = new Date().toISOString(), z = { id, m: ids, src, t, qs };
  change(d => {
    d.quizzes.push(z); if (d.quizzes.length > 8) d.quizzes = d.quizzes.slice(-8);
    d.chat.push({ id: "c" + id.slice(1), t, x: `Quiz duel: ${quizTitle(z)} · ${qs.length} questions`, k: "q", q: id });
    if (d.chat.length > 120) d.chat = d.chat.slice(-120);
  }, { now: true, quiet: true });
  closeQuizSheet();
  toast(mate().length ? "Quiz sent to your party" : "Quiz created");
  playQuiz(id);
}

const T0 = 10000, MAXHP = 100, BATTLE_SIZES = [10, 15, 20], MIN_TURNS = 10;
function turnLimit(i, mineRec, oppRec){

function battleState(b, A, B){

  let winner = null;
  for (let i = 0; i < n; i++){
    const q = b.qs[i], r = [recs[0][i], recs[1][i]], ev = [];

    const sk = [r[0].s || "", r[1].s || ""];

      if (regen[x] > 0){ hp[x] = Math.min(MAXHP, hp[x] + 8); regen[x]--; ev.push({ t: "regen", x, v: 8 }); }

        let d = Math.round(6 + 8 * sp); if (s === "double") d *= 2;
        incoming[o] += d; ev.push({ t: "hit", x, v: d, sp: Math.round(sp * 100), s });

      if (s === "drain"){ hp[o] -= 12; heal[x] += 12; ev.push({ t: "drain", x, v: 12 }); }
      if (s === "burn"){ poison[o] = 3; ev.push({ t: "burnset", x }); }
      if (s === "heal"){ heal[x] += 25; ev.push({ t: "heal", x, v: 25 }); }
      if (s === "regen"){ regen[x] = 3; ev.push({ t: "regenset", x }); }
      if (s === "freeze") ev.push({ t: "freezeset", x });
      if (s === "silence") ev.push({ t: "silenceset", x });
      if (me.it === "potion"){ heal[x] += 20; ev.push({ t: "potion", x, v: 20 }); }
      if (me.it === "flask"){ self[o] += 10; ev.push({ t: "flask", x, v: 10 }); }

}

function tone(f, at, dur, type, vol, slide){

}

  const s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();

}

const coinTag = n => `<span class="coins">${COIN_SVG}<b>${n}</b></span>`;
function quizTally(d, owner){
  owner = owner || myId || "me";
  const others = [{ id: myId || "me", d: mine }, ...Object.keys(players).filter(id => id !== myId).map(id => ({ id, d: normalize(players[id]) }))].filter(c => c.id !== owner);
  const pool = {}; [d, ...others.map(c => c.d)].forEach(p => (p.quizzes || []).forEach(z => { if (!pool[z.id]) pool[z.id] = z; }));
  let correct = 0, finished = 0, won = 0;
  for (const k in d.qa){
    const z = pool[k]; if (!z) continue; const r = resultOf(d, z); if (!r) continue;
    correct += r.right; if (r.done){ finished++; const o = others.find(c => c.d.qa && c.d.qa[k]); if (o){ const r2 = resultOf(o.d, z); if (r2 && r2.done && r.right > r2.right) won++; } }
  }
  return { correct, finished, won };
}
function battleTally(d, owner){
  owner = owner || myId || "me";
  const others = [{ id: myId || "me", d: mine }, ...Object.keys(players).filter(id => id !== myId).map(id => ({ id, d: normalize(players[id]) }))].filter(c => c.id !== owner);
  const pool = {}; [d, ...others.map(c => c.d)].forEach(p => (p.battles || []).forEach(z => { if (!pool[z.id]) pool[z.id] = z; }));
  let correct = 0, finished = 0, won = 0;
  for (const bid in d.bt){
    const b = pool[bid]; if (!b) continue; const A = d.bt[bid].ans;
    correct += A.filter((r, i) => b.qs[i] && r.k === b.qs[i].a).length;
    const o = others.find(c => c.d.bt && c.d.bt[bid]);
    if (o){ const st = battleState(b, A, o.d.bt[bid].ans); if (st.winner !== null){ finished++; if (st.winner === 0) won++; } }
  }
  return { correct, finished, won };
}
function coinsEarned(d, owner){
  const q = quizTally(d, owner), b = battleTally(d, owner);
  return (d.hero ? 50 : 0) + appsCoins(d) + (d.cert ? 150 : 0) + d.log.length * 10 + bonusDays(d) * 15 + Math.floor(totalMins(d) / 10)
    + Object.values(d.cards).filter(v => v === "got").length * 2 + Object.keys(d.res).length * 2 + Object.keys(d.checks).length * 5
    + q.correct * 2 + q.finished * 5 + q.won * 10
    + b.correct * 2 + b.finished * 10 + b.won * 25;
}
const coinsSpent = d => d.buys.reduce((s, x) => s + x.p, 0);
const coinBalance = (d, owner) => Math.max(0, coinsEarned(d, owner) - coinsSpent(d));
function itemsUsed(d, id){ let n = 0; for (const k in d.bt) d.bt[k].ans.forEach(a => { if (a.it === id) n++; }); return n; }
function itemCount(d, id){ return d.buys.filter(x => x.i === "item:" + id).length - itemsUsed(d, id); }
function boughtTier(d, hid){ return d.buys.filter(x => x.i.startsWith("sk:" + hid + ":")).reduce((m, x) => Math.max(m, Number(x.i.split(":")[2]) || 0), 0); }
function heroOwned(d, hid){ return d.buys.some(x => x.i === "hero:" + hid); }

function appsCoins(d){ return d.apps.reduce((s, a) => { const h = appHi(a); return s + (h >= 1 ? 3 : 0) + (h >= 3 ? 10 : 0) + (h >= 5 ? 100 : 0); }, 0); }

// ---- Certification
const EXAM_N = 30, EXAM_PASS = 0.8, EXAM_COOLDOWN = 30 * 60 * 1000;
const certReady = d => MODULES.every(m => starsOf(modPct(d, m)) >= 2);
function certIdFor(uid, t){ let h = 7; for (const ch of String(uid) + t) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return `FDQ-${t.slice(0, 4)}-${h.toString(36).toUpperCase().padStart(6, "0").slice(0, 6)}`; }
function buildExam(){
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const qs = [], used = new Set();
  const add = (mid, x) => { const key = mid + "|" + x.q; if (used.has(key)) return false; used.add(key); const order = shuffle([0, 1, 2, 3]); qs.push({ mid, q: x.q, o: order.map(k => x.o[k]), a: order.indexOf(0) }); return true; };
  MODULES.forEach(m => { if (BANK[m.id] && BANK[m.id].length) add(m.id, pick(BANK[m.id])); });
  const pool = shuffle(MODULES.flatMap(m => (BANK[m.id] || []).map(x => [m.id, x])));
  for (const [mid, x] of pool){ if (qs.length >= EXAM_N) break; add(mid, x); }
  return shuffle(qs).slice(0, EXAM_N);
}
let examRun = null;
function lastFail(d){ const f = d.exams.filter(e => !e.pass); return f.length ? f[f.length - 1] : null; }
function examWait(d){ const f = lastFail(d); if (!f || d.cert) return 0; return Math.max(0, Date.parse(f.t) + EXAM_COOLDOWN - Date.now()); }
function certPanelHTML(){
  const ready = certReady(mine), have = MODULES.filter(m => starsOf(modPct(mine, m)) >= 2).length;
  if (mine.cert) return `<section class="panel certpanel done"><span class="hud">Final certification</span><h3>Certified Forward Deployed Engineer ★</h3><p class="muted">Passed with ${Math.round(mine.cert.sc / mine.cert.n * 100)}% on ${esc(new Date(mine.cert.t).toLocaleDateString())}.</p><div class="row"><button class="gbtn gold" id="viewcert">View certificate</button></div></section>`;
  if (!ready){
    const left = MODULES.filter(m => starsOf(modPct(mine, m)) < 2);
    return `<section class="panel certpanel"><span class="hud">Final certification · locked</span><h3>FDE Quest Certification Exam</h3>
      <p class="muted">Unlocks when every mission has at least 2 stars. ${have} / ${MODULES.length} done.</p>
      <div class="xpbar"><i style="width:${Math.round(have / MODULES.length * 100)}%"></i></div>
      <div class="pmods">${left.slice(0, 6).map(m => `<button class="pmod" data-mission="${m.id}">${esc(m.title)}<i style="width:${modPct(mine, m)}%"></i></button>`).join("")}${left.length > 6 ? `<span class="hud">+${left.length - 6} more</span>` : ""}</div></section>`;
  }
  const wait = examWait(mine);
  return `<section class="panel certpanel ready"><span class="hud">Final certification · unlocked</span><h3>FDE Quest Certification Exam</h3>
    <p class="muted">${EXAM_N} questions across all ${MODULES.length} missions. 10 seconds each, no skills or items. Pass with ${Math.round(EXAM_PASS * 100)}% to earn your certificate, +200 XP and 150 coins.</p>
    ${wait ? `<p class="hud" style="color:var(--orange)">Retake available in ${Math.ceil(wait / 60000)} min. Review your weak missions first.</p>` : `<button class="gbtn gold big" id="startexam">Begin the exam</button>`}</section>`;
}
function bindCertPanel(){
  const s = $("startexam"); if (s) s.onclick = () => { examRun = { qs: buildExam(), i: 0, ans: [], start: 0, qi: -1 }; view = "exam"; render(); window.scrollTo({ top: 0, behavior: "auto" }); try { sfx.challenge(); } catch (e){} };
  const v = $("viewcert"); if (v) v.onclick = () => go("cert");

function renderExam(){
  if (!examRun){ view = "missions"; current = null; render(); return; }
  const r = examRun, n = r.qs.length;
  if (r.i >= n){ $("view").innerHTML = examResultHTML(); bindExamResult(); return; }
  const q = r.qs[r.i];
  if (r.qi !== r.i){ r.qi = r.i; r.start = Date.now(); r.lastTick = null; }
  $("view").innerHTML = `<div class="wrap" style="gap:14px">
    <div class="row"><span class="hud">FDE Quest Certification</span><span class="spacer"></span><span class="hud">${esc(MOD[q.mid] ? MOD[q.mid].title : "")}</span></div>
    <div class="qprog">${r.qs.map((x, k) => `<i class="${k < r.ans.length ? "ok" : k === r.i ? "cur" : ""}"></i>`).join("")}</div>
    <section class="bcard qcard"><div class="row"><span class="hud">Question ${r.i + 1} / ${n}</span><span class="spacer"></span><span class="hud" id="exsecs" style="color:var(--cyan)">10s</span></div>
      <div class="timer"><i id="extimer" style="width:100%"></i></div><div class="q">${esc(q.q)}</div></section>
    <div class="opts">${q.o.map((o, k) => `<button class="opt" data-ex="${k}"><span class="key">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <p class="hud" style="text-align:center;color:var(--dim)">No feedback until the end. Trust your training.</p>
  </div>`;
  $("view").querySelectorAll("[data-ex]").forEach(b => b.onclick = () => examAnswer(Number(b.dataset.ex)));

function examAnswer(k){
  const r = examRun; if (!r || r.i >= r.qs.length || r.ans.length !== r.i) return;
  r.ans.push(k); r.i++; try { sfx.click(); } catch (e){}
  if (r.i >= r.qs.length) finishExam(); else render();
}
function tickExam(){
  if (view !== "exam" || !examRun || examRun.i >= examRun.qs.length || !examRun.start) return;
  const el = $("extimer"); if (!el) return;
  const left = 10000 - (Date.now() - examRun.start), secs = Math.max(0, Math.ceil(left / 1000));
  el.style.width = Math.max(0, left / 100) + "%"; el.className = left < 3000 ? "low" : "";
  const t = $("exsecs"); if (t) t.textContent = secs + "s";
  if (secs <= 3 && secs > 0 && examRun.lastTick !== secs){ examRun.lastTick = secs; try { sfx.tick(); } catch (e){} }
  if (left <= 0) examAnswer(-1);
}
setInterval(tickExam, 200);
function finishExam(){
  const r = examRun, n = r.qs.length;
  const sc = r.ans.filter((a, i) => a === r.qs[i].a).length, pass = sc / n >= EXAM_PASS, t = new Date().toISOString();
  const by = {}; r.qs.forEach((q, i) => { by[q.mid] = by[q.mid] || [0, 0]; by[q.mid][1]++; if (r.ans[i] === q.a) by[q.mid][0]++; });
  r.result = { sc, n, pass, by, t };
  change(d => { d.exams.push({ t, sc, n, pass }); if (d.exams.length > 12) d.exams = d.exams.slice(-12); if (pass && !d.cert) d.cert = { t, sc, n, id: certIdFor(myId || "local", t) }; });
  setTimeout(() => { try { (pass ? sfx.victory : sfx.defeat)(); } catch (e){} }, 200);
  render();
}
function examResultHTML(){
  const res = examRun.result, pct = Math.round(res.sc / res.n * 100);
  const weak = Object.entries(res.by).filter(([, v]) => v[0] < v[1]).map(([mid]) => mid).filter(id => MOD[id]);
  return `<div class="wrap" style="gap:14px">
    <section class="panel results"><span class="hud">FDE Quest Certification</span><div class="big">${res.pass ? "CERTIFIED!" : "Not yet"}</div>

    if (channel){ sb.removeChannel(channel); channel = null; }
    if (authView !== "check" && authView !== "newpass") authView = "signin";
    renderWho(); renderAuth(); return;
  }
  if (authView === "newpass" || started) return;
  const u = session.user;
  viewer = { id: u.id, email: u.email, name: "", avatarUrl: initialsAvatar(u.email) };
  authView = "loading"; renderAuth();
  let inviteError = "";
  const inviteToken = u.user_metadata && u.user_metadata.signup_invite;
  if (inviteToken){
    try {
      const response = await fetch("/api/signup-code", {
        method: "POST",
        headers: { "content-type": "application/json", authorization: `Bearer ${session.access_token}` },
        body: JSON.stringify({ action: "complete", inviteToken })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) inviteError = result.error || "Could not finish account setup. Reload to retry.";
    } catch (e) { inviteError = "Could not finish account setup. Reload to retry."; }
  }
  const { data: mem, error: memErr } = await sb.from("members").select("email").limit(1);
  if (memErr || !mem || !mem.length){ authView = "notmember"; authMsg = inviteError; renderAuth(); return; }
  await loadProfiles();
  let nm = profCache[u.id] || (u.user_metadata && u.user_metadata.display_name) || "";
  if (!profCache[u.id]){ nm = nm || u.email.split("@")[0]; await sb.from("profiles").upsert({ id: u.id, display_name: nm.slice(0, 40) }); profCache[u.id] = nm; }
  viewer.name = nm; viewer.avatarUrl = initialsAvatar(nm);
  LS = "fde-field-prep-v1:" + u.id; mine = blank(); try { lastRead = localStorage.getItem(LS_READ()) || ""; } catch (e){} seenMsgs.clear(); seenReady = false;
  try { const raw = localStorage.getItem(LS); if (raw) mine = normalize(JSON.parse(raw)); } catch (e){}
  myId = u.id; mode = "shared"; dirty = false; saveMsg = ""; started = true;
  document.body.classList.add("authed");
  renderAuth(); render(); subscribe();
}
let sessionChain = Promise.resolve();
function queueSession(s){ sessionChain = sessionChain.then(() => onSession(s)).catch(() => {}); }

async function pull(){
  if (!started) return;
  const { data, error } = await sb.from("progress").select("user_id,data");
  if (error){ saveMsg = "Couldn't load the shared board. Check your connection and reload."; renderNote(); return; }
  if ((data || []).some(r => !(r.user_id in profCache))) await loadProfiles();
  const next = {}; (data || []).forEach(r => { next[r.user_id] = r.data; });
  players = next;
  if (!dirty && !writing){
    if (next[myId]){
      const remote = normalize(next[myId]);
      if (firstSnap && mine.updated && (!remote.updated || mine.updated > remote.updated)){ dirty = true; flush(); }
      else { mine = remote; try { localStorage.setItem(LS, JSON.stringify(mine)); } catch (e){} }
    } else if (firstSnap && mine.updated){ dirty = true; flush(); }
  }
  firstSnap = false; dataReady = true;
  if (document.activeElement && document.activeElement.id === "mynote"){ renderNote(); return; }
  render();
}
function subscribe(){
  firstSnap = true; pull();
  channel = sb.channel("progress-live")
    .on("postgres_changes", { event: "*", schema: "public", table: "progress" }, () => { clearTimeout(subscribe.t); subscribe.t = setTimeout(pull, 300); })
    .subscribe();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && started) pull(); });

if (!sb){ authView = "setup"; renderAuth(); }
else {
  authView = "loading"; renderAuth();
  sb.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY"){ authView = "newpass"; authMsg = ""; document.body.classList.remove("authed"); renderAuth(); return; }
    setTimeout(() => queueSession(session), 0);
  });
}

// AI quizzes through the Vercel function (api/quiz.js). Turn on with aiQuiz: true in config.js.
if (CFG.aiQuiz && sb) aiGen = async (prompt, signal) => {
  const { data } = await sb.auth.getSession();
  const tok = data.session && data.session.access_token;
  let r;
  try { r = await fetch("/api/quiz", { method: "POST", headers: { "content-type": "application/json", authorization: "Bearer " + tok }, body: JSON.stringify({ prompt }), signal }); }
  catch (e) { throw { code: e && e.name === "AbortError" ? "cancelled" : "upstream_error" }; }
  if (!r.ok) throw { code: r.status === 503 ? "sampling_disabled" : r.status === 403 ? "not_granted" : "upstream_error" };
  const j = await r.json(); return j.questions;
};

// ---- installable app + push notifications (deployed version only)
const NOTIF = {
  supported: "serviceWorker" in navigator && "PushManager" in window && "Notification" in window,
  status: "checking", busy: false, msg: "",
  key(){ return CFG.vapidPublicKey && !/YOUR-/.test(CFG.vapidPublicKey) ? CFG.vapidPublicKey : ""; },
  async refresh(){
    if (!this.supported){ this.status = "unsupported"; return; }
    if (!this.key()){ this.status = "nokey"; return; }
    try {
      const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
      this.status = Notification.permission === "denied" ? "denied" : sub ? "on" : "off";
    } catch (e){ this.status = "off"; }
  },
  html(){
    const S = {
      checking: ["Checking…", ""],
      unsupported: ["Not available here", "Install the app (Add to Home screen) and open it from there. On iPhone, notifications need iOS 16.4 or later."],
      nokey: ["Not set up yet", "David needs to add the VAPID key to config.js (see README)."],
      denied: ["Blocked", "Notifications are blocked for this app. Turn them on in your phone's settings for this app, then reload."],
      off: ["Off", "Get a ping for chats, quiz duels, battle challenges, your turn in battle, and a daily reminder."],
      on: ["On", "This device gets chats, invites, battle turns and the 8pm reminder."]
    }[this.status] || ["Off", ""];
    return `<section class="panel notifpanel"><div class="ptitle"><h3>Notifications</h3><span class="pill ${this.status === "on" ? "good" : this.status === "denied" ? "bad" : "warn"}">${esc(S[0])}</span></div>
      <p class="muted">${esc(this.msg || S[1])}</p>
      <div class="row">${this.status === "off" ? `<button class="gbtn gold" id="notifon" ${this.busy ? "disabled" : ""}>Turn on notifications</button>` : ""}
      ${this.status === "on" ? `<button class="gbtn cyan" id="notiftest" ${this.busy ? "disabled" : ""}>Send a test</button><button class="gbtn" id="notifoff" ${this.busy ? "disabled" : ""}>Turn off</button>` : ""}</div></section>`;
  },
  bind(){
    const on = $("notifon"); if (on) on.onclick = () => this.enable();
    const off = $("notifoff"); if (off) off.onclick = () => this.disable();
    const t = $("notiftest"); if (t) t.onclick = () => this.test();
  },
  b64(key){ const p = "=".repeat((4 - key.length % 4) % 4), raw = atob((key + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from([...raw].map(c => c.charCodeAt(0))); },
  async enable(){
    this.busy = true; this.msg = ""; render();
    try {
      const perm = await Notification.requestPermission();
      if (perm !== "granted"){ this.status = perm === "denied" ? "denied" : "off"; this.msg = perm === "denied" ? "" : "Allow notifications when your phone asks."; return; }
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: this.b64(this.key()) });
      const j = sub.toJSON();
      const { error } = await sb.from("push_subs").upsert({ endpoint: j.endpoint, user_id: myId, sub: j });
      if (error) throw error;
      this.status = "on"; this.msg = ""; toast("Notifications on"); try { sfx.coin(); } catch (e){}
    } catch (e){ this.msg = "Couldn't turn on notifications. Try again, or reinstall the app."; }
    finally { this.busy = false; render(); }
  },
  async disable(){
    this.busy = true; render();
    try {
      const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
      if (sub){ await sb.from("push_subs").delete().eq("endpoint", sub.endpoint); await sub.unsubscribe(); }
      this.status = "off"; toast("Notifications off");
    } catch (e){ this.msg = "Couldn't turn them off. Try again."; }
    finally { this.busy = false; render(); }
  },
  async test(){
    this.busy = true; render();
    try {
      const { data } = await sb.auth.getSession();
      const r = await fetch("/api/notify-test", { method: "POST", headers: { authorization: "Bearer " + (data.session && data.session.access_token) } });
      const j = await r.json().catch(() => ({}));
      this.msg = r.ok && j.sent ? "Test sent. It should appear in a few seconds." : r.status === 503 ? "The server isn't set up for notifications yet (see README)." : "Couldn't send a test. Turn notifications off and on again.";
    } catch (e){ this.msg = "Couldn't reach the server."; }
    finally { this.busy = false; render(); }
  }
};
window.FDE_NOTIF = NOTIF;
if ("serviceWorker" in navigator){
  navigator.serviceWorker.register("/sw.js").then(() => NOTIF.refresh()).then(() => { if (view === "us") render(); }).catch(() => { NOTIF.status = "unsupported"; });
} else NOTIF.status = "unsupported";
